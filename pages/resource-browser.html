<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>Resources – MedExamPro</title>

    <link rel="manifest" href="/manifest.json">
    <link rel="stylesheet" href="/css/common.css" media="all">
    <link rel="stylesheet" href="/css/content.css" media="all">
    <link rel="stylesheet" href="/css/viewer.css" media="all">

    <!-- PDF.js -->
    <script src="/libs/pdfjs/pdf.min.js"></script>
    <script>
        pdfjsLib.GlobalWorkerOptions.workerSrc = '/libs/pdfjs/pdf.worker.min.js';
    </script>

    <!-- Inline dark theme fallback + viewer additions -->
    <style id="theme-style">
        /* ---- Base ---- */
        body {
            background: #1a1a2e;
            color: #eee;
            margin: 0;
            padding: 0;
            font-family: system-ui, -apple-system, sans-serif;
        }
        .shimmer-card {
            background: #2a2a3e;
            border-color: #444;
        }
        .shimmer-thumbnail,
        .shimmer-line,
        .shimmer-btn,
        .shimmer-menu {
            background: #3a3a4e;
            background: linear-gradient(90deg, #3a3a4e 25%, #555 50%, #3a3a4e 75%);
        }
        .fixed-header {
            background: #1e1e2f;
            border-bottom: 1px solid #333;
        }
        .header-row .nav-buttons button,
        .header-row .filter-btn {
            background: #2a2a3e;
            color: #eee;
            border: 1px solid #444;
        }
        .header-row input[type="text"] {
            background: #2a2a3e;
            color: #eee;
            border: 1px solid #444;
        }
        .filter-dropdown {
            background: #2a2a3e;
            border-color: #444;
        }
        .filter-dropdown button {
            color: #eee;
        }
        .filter-dropdown button:hover {
            background: #3a3a4e;
        }

        /* ---- Viewer Styles (theme‑aware) ---- */
        .viewer-container {
            background: var(--bg-primary, #1a1a2e);
            touch-action: auto;
            overflow: auto;
        }
        .viewer-header {
            background: var(--bg-card, #1e1e2f);
            border-bottom: 1px solid var(--border, #333);
            position: relative;
            transition: transform 0.3s ease, opacity 0.3s ease;
        }
        .viewer-footer {
            background: var(--bg-card, #1e1e2f);
            border-top: 1px solid var(--border, #333);
            transition: transform 0.3s ease, opacity 0.3s ease;
        }
        .viewer-header.hidden,
        .viewer-footer.hidden {
            transform: translateY(-100%);
            opacity: 0;
            pointer-events: none;
        }
        .viewer-footer.hidden {
            transform: translateY(100%);
        }
        .viewer-header button {
            color: var(--text-primary, #eee);
        }

        /* Loading dots */
        .viewer-loading-dots {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100%;
            font-size: 2rem;
            color: var(--text-secondary, #888);
            gap: 0.25rem;
        }
        .viewer-loading-dots span {
            animation: viewer-dot-bounce 1.4s infinite ease-in-out both;
            display: inline-block;
        }
        .viewer-loading-dots span:nth-child(1) { animation-delay: 0s; }
        .viewer-loading-dots span:nth-child(2) { animation-delay: 0.2s; }
        .viewer-loading-dots span:nth-child(3) { animation-delay: 0.4s; }
        @keyframes viewer-dot-bounce {
            0%, 80%, 100% { transform: translateY(0); }
            40% { transform: translateY(-0.5em); }
        }

        /* Page jump input */
        #viewer-page-input {
            width: 50px;
            text-align: center;
            background: var(--bg-secondary);
            border: 1px solid var(--border);
            border-radius: 4px;
            color: var(--text-primary);
            padding: 2px 4px;
            font-size: inherit;
            font-family: inherit;
        }
        #viewer-page-input:focus {
            outline: 2px solid var(--accent);
        }

        /* Outline drawer */
        .outline-drawer {
            position: absolute;
            top: 100%;
            left: 0;
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 0 0 8px 8px;
            box-shadow: var(--shadow);
            max-height: 60vh;
            overflow-y: auto;
            min-width: 200px;
            z-index: 20;
            display: none;
            padding: 0;
        }
        .outline-drawer.open {
            display: block;
        }
        .outline-drawer ul.outline-list {
            list-style: none;
            margin: 0;
            padding: 0.3rem 0;
        }
        .outline-drawer li.outline-item {
            padding: 0;
            margin: 0;
            border-bottom: 1px solid var(--border-light);
            font-size: 0.85rem;
        }
        .outline-drawer li.outline-item a {
            display: block;
            padding: 0.4rem 1rem;
            color: var(--text-primary);
            text-decoration: none;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .outline-drawer li.outline-item a:hover {
            background: var(--bg-secondary);
        }
        .outline-drawer li.outline-item.level-1 a { padding-left: 1.5rem; }
        .outline-drawer li.outline-item.level-2 a { padding-left: 2.5rem; }
        .outline-drawer li.outline-item.level-3 a { padding-left: 3.5rem; }
        .outline-drawer .outline-empty {
            padding: 0.5rem 1rem;
            color: var(--text-muted);
            font-style: italic;
            border: none;
        }

        /* Ensure images can be zoomed */
        .viewer-main img {
            touch-action: none;
            max-width: 100%;
            height: auto;
        }
        .viewer-main {
            overflow: auto;
            touch-action: auto;
        }

        /* Auto‑hide classes (applied by viewer.js) */
        .viewer-header.hidden,
        .viewer-footer.hidden {
            transition: transform 0.3s ease, opacity 0.3s ease;
        }
    </style>

    <!-- Core modules -->
    <script type="module" src="/scripts/utils.js"></script>
    <script type="module" src="/scripts/ui.js"></script>
    <script type="module" src="/scripts/router.js"></script>
    <script type="module" src="/scripts/app.js"></script>
    <script type="module" src="/scripts/subscription.js"></script>
    <script type="module" src="/scripts/db.js"></script>
    <script type="module" src="/scripts/content.js"></script>
    <script type="module" src="/scripts/viewer.js"></script>
    <script type="module" src="/scripts/resource-browser.js"></script>
    <script type="module" src="/scripts/convex-client.js"></script>
    <script type="module" src="/scripts/auth.js"></script>

    <script>
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('/service-worker.js').catch(() => {});
        }
    </script>
</head>
<body>

    <!-- ===== APP VIEW (Resource Browser) ===== -->
    <div id="app">
        <header class="fixed-header">
            <div class="header-row">
                <div class="logo-area">
                    <img src="/assets/images/logo.png" alt="Logo" width="30" height="30">
                    <span>MedHub</span>
                </div>
                <div class="nav-buttons">
                    <button id="back-btn" onclick="router.navigateTo('subjects.html')" aria-label="Back">← Back</button>
                    <button id="theme-btn" onclick="ui.toggleTheme()" aria-label="Toggle theme">🌓</button>
                </div>
            </div>
            <div class="header-row">
                <div class="title-area">
                    <h1 id="page-title">Study Resources</h1>
                </div>
            </div>
            <div class="header-row search-filter-row">
                <input type="text" id="search-input" placeholder="Search documents..." autocomplete="off">
                <div class="filter-wrapper">
                    <button class="filter-btn" id="filter-btn">☰ Filter</button>
                    <div class="filter-dropdown" id="filter-dropdown">
                        <button data-filter="all" class="active-filter">All</button>
                        <button data-filter="favorites">⭐ Favorites</button>
                        <button data-filter="downloaded">✅ Downloaded</button>
                        <button data-filter="recent">🕒 Recent</button>
                    </div>
                </div>
            </div>
        </header>

        <main class="main-with-header">
            <div id="resource-grid" class="resource-grid">
                <!-- 8 skeleton cards (same as before) -->
                <div class="shimmer-card"><div class="shimmer-thumbnail"></div><div class="shimmer-info"><div class="shimmer-line shimmer-title"></div><div class="shimmer-line shimmer-meta"></div><div class="shimmer-line shimmer-badge"></div><div class="shimmer-line shimmer-stats"></div><div class="shimmer-actions"><div class="shimmer-btn"></div><div class="shimmer-menu"></div></div></div></div>
                <div class="shimmer-card"><div class="shimmer-thumbnail"></div><div class="shimmer-info"><div class="shimmer-line shimmer-title"></div><div class="shimmer-line shimmer-meta"></div><div class="shimmer-line shimmer-badge"></div><div class="shimmer-line shimmer-stats"></div><div class="shimmer-actions"><div class="shimmer-btn"></div><div class="shimmer-menu"></div></div></div></div>
                <div class="shimmer-card"><div class="shimmer-thumbnail"></div><div class="shimmer-info"><div class="shimmer-line shimmer-title"></div><div class="shimmer-line shimmer-meta"></div><div class="shimmer-line shimmer-badge"></div><div class="shimmer-line shimmer-stats"></div><div class="shimmer-actions"><div class="shimmer-btn"></div><div class="shimmer-menu"></div></div></div></div>
                <div class="shimmer-card"><div class="shimmer-thumbnail"></div><div class="shimmer-info"><div class="shimmer-line shimmer-title"></div><div class="shimmer-line shimmer-meta"></div><div class="shimmer-line shimmer-badge"></div><div class="shimmer-line shimmer-stats"></div><div class="shimmer-actions"><div class="shimmer-btn"></div><div class="shimmer-menu"></div></div></div></div>
                <div class="shimmer-card"><div class="shimmer-thumbnail"></div><div class="shimmer-info"><div class="shimmer-line shimmer-title"></div><div class="shimmer-line shimmer-meta"></div><div class="shimmer-line shimmer-badge"></div><div class="shimmer-line shimmer-stats"></div><div class="shimmer-actions"><div class="shimmer-btn"></div><div class="shimmer-menu"></div></div></div></div>
                <div class="shimmer-card"><div class="shimmer-thumbnail"></div><div class="shimmer-info"><div class="shimmer-line shimmer-title"></div><div class="shimmer-line shimmer-meta"></div><div class="shimmer-line shimmer-badge"></div><div class="shimmer-line shimmer-stats"></div><div class="shimmer-actions"><div class="shimmer-btn"></div><div class="shimmer-menu"></div></div></div></div>
                <div class="shimmer-card"><div class="shimmer-thumbnail"></div><div class="shimmer-info"><div class="shimmer-line shimmer-title"></div><div class="shimmer-line shimmer-meta"></div><div class="shimmer-line shimmer-badge"></div><div class="shimmer-line shimmer-stats"></div><div class="shimmer-actions"><div class="shimmer-btn"></div><div class="shimmer-menu"></div></div></div></div>
                <div class="shimmer-card"><div class="shimmer-thumbnail"></div><div class="shimmer-info"><div class="shimmer-line shimmer-title"></div><div class="shimmer-line shimmer-meta"></div><div class="shimmer-line shimmer-badge"></div><div class="shimmer-line shimmer-stats"></div><div class="shimmer-actions"><div class="shimmer-btn"></div><div class="shimmer-menu"></div></div></div></div>
            </div>

            <div id="load-more-container">
                <div id="load-more-spinner" style="display: none;" class="loading-spinner-small">Loading more...</div>
                <button id="load-more-btn" class="btn-secondary" style="display: none;">Load More</button>
            </div>
        </main>
    </div>

    <!-- ===== VIEWER VIEW (Embedded) ===== -->
    <div id="viewer" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 2000; background: var(--bg-primary); touch-action: auto; overflow: auto;">
        <div class="viewer-container" style="height: 100%; display: flex; flex-direction: column; touch-action: auto;">
            <header class="viewer-header" id="viewer-header" style="position: relative; touch-action: auto;">
                <div class="left-group">
                    <button id="viewer-outline-btn" class="btn-icon" title="Document outline">☰</button>
                    <button id="viewer-back-btn" class="btn-icon" aria-label="Back to resources">←</button>
                    <div class="viewer-title" id="viewer-title">Loading...</div>
                </div>
                <div class="right-group">
                    <button id="viewer-search-btn" class="btn-icon" title="Search">🔍</button>
                    <div class="search-bar" id="viewer-search-bar">
                        <input type="text" id="viewer-search-input" placeholder="Find..." autocomplete="off">
                        <span class="search-results" id="viewer-search-count"></span>
                        <button id="viewer-search-prev" class="btn-icon" title="Previous match">↑</button>
                        <button id="viewer-search-next" class="btn-icon" title="Next match">↓</button>
                        <div class="search-options" id="viewer-search-options">
                            <label><input type="checkbox" id="viewer-search-case"> Aa</label>
                            <label><input type="checkbox" id="viewer-search-whole"> “”</label>
                        </div>
                        <button id="viewer-search-close" class="btn-icon" title="Close search">✕</button>
                    </div>
                    <button id="viewer-toggle-view" class="btn-icon" title="Toggle view">📄 Page View</button>
                    <button id="viewer-open-local" class="btn-icon" title="Open local file">📂</button>
                    <button id="viewer-fullscreen-btn" class="btn-icon" title="Fullscreen">⛶</button>
                </div>
                <!-- Outline drawer (populated by viewer.js) -->
                <div class="outline-drawer" id="viewer-outline-drawer"></div>
            </header>

            <main class="viewer-main" id="viewer-main" style="touch-action: auto; overflow: auto;">
                <div class="loading-container" id="viewer-loading">
                    <div class="spinner"></div>
                    <p>Loading document...</p>
                </div>
                <progress id="viewer-progress" style="display: none; width: 80%; margin: 1rem auto;"></progress>
            </main>

            <div class="viewer-footer" id="viewer-footer" style="display: none; touch-action: auto;">
                <div class="page-nav">
                    <button id="viewer-prev-page" disabled>◀ Previous</button>
                    <span>
                        Page
                        <input type="number" id="viewer-page-input" value="1" min="1" step="1">
                        of <span id="viewer-page-count">1</span>
                    </span>
                    <button id="viewer-next-page" disabled>Next ▶</button>
                </div>
                <div class="zoom-controls">
                    <button id="viewer-zoom-out" title="Zoom out">−</button>
                    <span id="viewer-zoom-level">100%</span>
                    <button id="viewer-zoom-in" title="Zoom in">+</button>
                    <button id="viewer-zoom-fit" title="Fit to width">⛶</button>
                    <button id="viewer-zoom-reset" title="Reset zoom">1:1</button>
                </div>
            </div>

            <!-- Hidden file input for local files -->
            <input type="file" id="viewer-file-input" class="file-input" accept=".pdf,.jpg,.jpeg,.png,.webp,.gif,.docx,.doc,.pptx,.ppt,.txt,.md">
        </div>
    </div>

    <!-- ============================================================
         Minimal Coordination Script
         ============================================================ -->
    <script type="module">
        import * as app from '../scripts/app.js';
        import * as ui from '../scripts/ui.js';
        import * as router from '../scripts/router.js';
        import * as resourceBrowser from '../scripts/resource-browser.js';
        import * as subscription from '../scripts/subscription.js';

        // Expose docMap and viewer functions globally for viewer.js
        window.docMap = resourceBrowser.docMap;
        window.showViewer = resourceBrowser.showViewer;
        window.closeViewer = resourceBrowser.closeViewer;

        // Initialize the app
        (async function init() {
            await app.initializeApp();
            ui.applyTheme();

            if (!app.checkAuth()) {
                router.navigateTo('login.html');
                return;
            }

            const params = new URLSearchParams(window.location.search);
            const subject = params.get('subject');
            const type = params.get('type'); // 'study', 'pastpaper', 'textbook', 'visual'

            if (!subject || !type) {
                ui.showToast('Invalid resource request', 'error');
                router.navigateTo('subjects.html');
                return;
            }

            await resourceBrowser.initResourceBrowser(subject, type);
        })();
    </script>

    <script data-lazy data-src="/scripts/offline.js"></script>
</body>
</html>
