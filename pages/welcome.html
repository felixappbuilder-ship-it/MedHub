<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Welcome – MedHub</title>

    <link rel="manifest" href="/manifest.json" />
    <link rel="stylesheet" href="/css/common.css" media="all" />
    <link rel="stylesheet" href="/css/welcome.css" media="all" />

    <style>
        /* ===== Keep header/footer styles from original ===== */
        header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 1rem 2rem;
            background: var(--bg-secondary, #fff);
            border-bottom: 1px solid var(--border, #e2e8f0);
        }
        header .logo {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            font-weight: 700;
            font-size: 1.25rem;
            color: var(--text-primary, #0f172a);
        }
        header .logo img {
            width: 40px;
            height: 40px;
            border-radius: 8px;
        }
        header .btn-outline {
            background: transparent;
            border: 1px solid var(--border, #e2e8f0);
            border-radius: 9999px;
            padding: 0.4rem 0.9rem;
            font-size: 1.25rem;
            cursor: pointer;
            line-height: 1;
            transition: background 0.2s, border-color 0.2s;
            color: var(--text-primary, #0f172a);
        }
        header .btn-outline:hover {
            background: var(--bg-hover, #f1f5f9);
            border-color: var(--text-muted, #94a3b8);
        }

        /* ===== main content: flex to center card vertically ===== */
        .page-container {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            background: var(--bg-primary, #f8fafc);
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
        }

        main {
            flex: 1 0 auto;                /* take all remaining space */
            display: flex;
            align-items: center;            /* vertical centering */
            justify-content: center;        /* horizontal centering */
            padding: 1rem;
        }

        .welcome-card {
            max-width: 550px;
            width: 100%;
            padding: 2.5rem;
            background: var(--bg-card, #ffffff);
            border-radius: var(--radius-lg, 16px);
            box-shadow: var(--shadow-lg, 0 10px 40px rgba(0, 0, 0, 0.08));
            text-align: center;
        }

        .welcome-card h2 {
            font-size: 2rem;
            margin-bottom: 1rem;
            color: var(--text-primary, #0f172a);
        }
        .welcome-card p {
            color: var(--text-secondary, #475569);
            margin-bottom: 2rem;
        }

        .action-buttons {
            display: flex;
            flex-direction: column;
            gap: 1rem;
            margin-top: 2rem;
        }
        .action-buttons .btn-primary,
        .action-buttons .btn-secondary,
        .action-buttons .btn-link {
            padding: 0.75rem 1.5rem;
            border-radius: 9999px;
            font-weight: 600;
            font-size: 1rem;
            cursor: pointer;
            transition: background 0.2s, transform 0.1s;
            border: none;
            text-decoration: none;
            display: inline-block;
        }
        .action-buttons .btn-primary {
            background: var(--accent, #2563eb);
            color: #fff;
        }
        .action-buttons .btn-primary:hover {
            background: var(--accent-dark, #1d4ed8);
            transform: scale(1.01);
        }
        .action-buttons .btn-secondary {
            background: transparent;
            color: var(--text-primary, #0f172a);
            border: 1px solid var(--border, #e2e8f0);
        }
        .action-buttons .btn-secondary:hover {
            background: var(--bg-hover, #f1f5f9);
        }
        .action-buttons .btn-link {
            background: transparent;
            color: var(--text-secondary, #475569);
            font-weight: 500;
        }
        .action-buttons .btn-link:hover {
            color: var(--accent, #2563eb);
            text-decoration: underline;
        }

        .guest-note {
            font-size: 0.875rem;
            color: var(--text-muted, #94a3b8);
            margin-top: 1.5rem;
        }

        footer {
            flex-shrink: 0;
            text-align: center;
            padding: 1.5rem 1rem;
        }
        footer .btn-text {
            background: transparent;
            border: none;
            color: var(--text-secondary, #475569);
            font-size: 0.95rem;
            cursor: pointer;
            padding: 0.5rem 1rem;
            border-radius: 8px;
            transition: background 0.2s;
        }
        footer .btn-text:hover {
            background: var(--bg-hover, #f1f5f9);
        }

        /* ===== responsive ===== */
        @media (max-width: 640px) {
            header {
                padding: 0.75rem 1rem;
            }
            header .logo span {
                font-size: 1rem;
            }
            .welcome-card {
                padding: 1.5rem;
            }
            .welcome-card h2 {
                font-size: 1.5rem;
            }
        }
    </style>

    <script>
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('/service-worker.js').catch(() => {});
        }
    </script>

    <script type="module" src="/scripts/utils.js"></script>
    <script type="module" src="/scripts/ui.js"></script>
    <script type="module" src="/scripts/router.js"></script>
    <script type="module" src="/scripts/app.js"></script>
    <script type="module" src="/scripts/db.js"></script>
    <script type="module" src="/scripts/auth.js"></script>

<script type="module">
    import * as app from '../scripts/app.js';
    import * as ui from '../scripts/ui.js';
    import * as router from '../scripts/router.js';

    (async function() {
        await app.initializeApp();
        ui.applyTheme();

        if (app.checkAuth()) {
            router.navigateTo('subjects.html');
            return;
        }

        const redirect = sessionStorage.getItem('redirectAfterLogin');

        const loginBtn = document.querySelector('#loginBtn');
        const signupBtn = document.querySelector('#signupBtn');

        if (loginBtn) {
            loginBtn.addEventListener('click', () => {
                let url = 'login.html';
                if (redirect) {
                    url += `?redirect=${encodeURIComponent(redirect)}`;
                }
                router.navigateTo(url);
            });
        }

        if (signupBtn) {
            signupBtn.addEventListener('click', () => {
                let url = 'signup.html';
                if (redirect) {
                    url += `?redirect=${encodeURIComponent(redirect)}`;
                }
                router.navigateTo(url);
            });
        }

        // The "Continue as Guest" button uses inline onclick – it's fine.
    })();
</script>
</head>

<body>
    <div class="page-container">

        <!-- ===== HEADER ===== -->
        <header>
            <div class="logo">
                <img src="/assets/images/logo.png" alt="MedHub Logo" width="40" height="40" />
                <span>MedHub</span>
            </div>
            <button onclick="ui.toggleTheme()" class="btn-outline" aria-label="Toggle theme">
                🌓
            </button>
        </header>

        <!-- ===== MAIN ===== -->
        <main>
            <div class="welcome-card">
                <h2>Welcome back, future doctor 👋</h2>
                <p>Access your 5,000+ question bank, track progress, and simulate exams.</p>

                <div class="action-buttons">
                    <button id="loginBtn" class="btn-primary">
                        Login
                    </button>
                    <button id="signupBtn" class="btn-secondary">
                        Create Account
                    </button>
                    <button onclick="router.navigateTo('subjects.html')" class="btn-link">
                        Continue as Guest
                    </button>
                </div>

                <p class="guest-note">
                    Guest mode: browse subjects, see question counts. Subscribe to take exams.
                </p>
            </div>
        </main>

        <!-- ===== FOOTER ===== -->
        <footer>
            <button onclick="router.navigateTo('../index.html')" class="btn-text">
                ← Back to Home
            </button>
        </footer>

    </div>
</body>

</html>
