<head>

    <!-- Inline dark theme fallback + shimmer styles -->
    <style id="theme-style">
        body {
            background: #1a1a2e;
            color: #eee;
            margin: 0;
            padding: 0;
            font-family: system-ui, -apple-system, sans-serif;
        }
        @keyframes shimmer {
            0% { background-position: -200px 0; }
            100% { background-position: calc(200px + 100%) 0; }
        }
        .shimmer-plan-card {
            background: #2a2a3e;
            border: 1px solid #444;
            border-radius: var(--radius);
            padding: 1.5rem;
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
        }
        .shimmer-line {
            height: 16px;
            background: #3a3a4e;
            background: linear-gradient(90deg, #3a3a4e 25%, #555 50%, #3a3a4e 75%);
            background-size: 200px 100%;
            animation: shimmer 1.5s infinite;
            border-radius: 4px;
        }
        .shimmer-title { height: 24px; width: 60%; }
        .shimmer-price { height: 32px; width: 40%; }
        .shimmer-duration { height: 18px; width: 50%; }
        .shimmer-feature { height: 14px; width: 80%; }
        .shimmer-btn { height: 40px; width: 100%; border-radius: var(--radius-sm); }
        .shimmer-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
            gap: 1.5rem;
            margin: 2rem 0;
        }
        .shimmer-banner {
            height: 60px;
            background: #2a2a3e;
            border-radius: var(--radius);
            margin-bottom: 2rem;
            background: linear-gradient(90deg, #2a2a3e 25%, #444 50%, #2a2a3e 75%);
            background-size: 200px 100%;
            animation: shimmer 1.5s infinite;
        }
        .shimmer-header {
            padding: 0.5rem 1rem;
            background: #1e1e2f;
            border-bottom: 1px solid #333;
        }
        .shimmer-header-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .shimmer-header-bottom {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 0.5rem;
        }
        .shimmer-logo {
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }
        .shimmer-logo-icon {
            width: 40px; height: 40px; border-radius: 6px;
            background: #3a3a4e;
            background: linear-gradient(90deg, #3a3a4e 25%, #555 50%, #3a3a4e 75%);
            background-size: 200px 100%;
            animation: shimmer 1.5s infinite;
        }
        .shimmer-logo-text {
            width: 80px; height: 20px;
            background: #3a3a4e;
            background: linear-gradient(90deg, #3a3a4e 25%, #555 50%, #3a3a4e 75%);
            background-size: 200px 100%;
            animation: shimmer 1.5s infinite;
            border-radius: 4px;
        }
        .shimmer-btn-sm {
            width: 40px; height: 40px; border-radius: 50%;
            background: #3a3a4e;
            background: linear-gradient(90deg, #3a3a4e 25%, #555 50%, #3a3a4e 75%);
            background-size: 200px 100%;
            animation: shimmer 1.5s infinite;
            display: inline-block;
        }
        .shimmer-title-large {
            height: 28px; width: 200px;
            background: #3a3a4e;
            background: linear-gradient(90deg, #3a3a4e 25%, #555 50%, #3a3a4e 75%);
            background-size: 200px 100%;
            animation: shimmer 1.5s infinite;
            border-radius: 4px;
        }
        .shimmer-status {
            height: 28px; width: 140px;
            background: #3a3a4e;
            background: linear-gradient(90deg, #3a3a4e 25%, #555 50%, #3a3a4e 75%);
            background-size: 200px 100%;
            animation: shimmer 1.5s infinite;
            border-radius: 4px;
        }
        .shimmer-payment-info {
            height: 80px;
            background: #2a2a3e;
            border-radius: var(--radius);
            margin-top: 2rem;
            background: linear-gradient(90deg, #2a2a3e 25%, #444 50%, #2a2a3e 75%);
            background-size: 200px 100%;
            animation: shimmer 1.5s infinite;
        }
        .shimmer-text-btn {
            width: 120px; height: 40px;
            background: #3a3a4e;
            background: linear-gradient(90deg, #3a3a4e 25%, #555 50%, #3a3a4e 75%);
            background-size: 200px 100%;
            animation: shimmer 1.5s infinite;
            border-radius: 4px;
            margin: 0 auto;
        }
        #real-content { display: none; }
    </style>

    <style>
        /* Real header layout */
        .sub-header {
            background: var(--bg-card);
            border-bottom: 1px solid var(--border);
            padding: 0.5rem 1rem;
        }
        .sub-header-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .sub-header-top .left-group {
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }
        .sub-header-top .right-group {
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }
        .sub-header-bottom {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 0.3rem;
        }
        .sub-header-bottom h1 {
            font-size: 1.4rem;
            margin: 0;
        }
        .status-area {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            font-size: 0.9rem;
        }
        .status-area .status-text {
            color: var(--text-secondary);
        }
        .trial-btn {
            background: var(--accent);
            color: white;
            border: none;
            padding: 0.3rem 0.8rem;
            border-radius: 30px;
            font-weight: 600;
            cursor: pointer;
        }
        .trial-btn:hover {
            background: var(--accent-dark);
        }
        /* Remove old back button at bottom */
        .sub-back-bottom {
            display: none;
        }
        .plan-card {
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .plan-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 10px 20px rgba(0,0,0,0.15);
        }
        .plan-card.disabled {
            opacity: 0.6;
            pointer-events: none;
            cursor: not-allowed;
        }
        .plan-card button {
            pointer-events: none;
        }
    </style>

    <script type="module">
        import * as app from '../scripts/app.js';
        import * as ui from '../scripts/ui.js';
        import * as router from '../scripts/router.js';
        import * as subscription from '../scripts/subscription.js';
        import * as utils from '../scripts/utils.js';

        let plansList = [];
        let trialEligible = false;

        (async function initSubscription() {
            console.log('[Subscription] Initializing...');
            await app.initializeApp();
            ui.applyTheme();

            if (!app.checkAuth()) {
                ui.showToast('Please log in to view subscriptions', 'warning');
                router.navigateTo('login.html');
                return;
            }

            // Get current subscription and trial eligibility
            const currentSub = app.getSubscription();
            trialEligible = await subscription.checkTrialEligibility();

            // Render header status
            renderHeaderStatus(currentSub);

            // Load plans and render
            const plans = await subscription.getSubscriptionPlans();
            plansList = plans;
            renderPlanCards(plans);

            // Disable trial card if not eligible
            const trialCard = document.querySelector('.trial-card');
            if (trialCard && !trialEligible) {
                trialCard.classList.add('disabled');
            }

            // Hide shimmer, show real content
            document.getElementById('shimmer-content').style.display = 'none';
            document.getElementById('real-content').style.display = 'block';
        })();

        function renderHeaderStatus(sub) {
            const statusContainer = document.getElementById('status-area');
            if (!statusContainer) return;

            // Case: active subscription
            if (sub && sub.isActive) {
                const remaining = subscription.formatRemainingTime?.(sub.expiryDate) || '';
                statusContainer.innerHTML = `
                    <span class="status-text">Plan: ${sub.plan} · expires ${utils.formatDate(sub.expiryDate)}</span>
                    <span class="status-text">(${remaining} left)</span>
                `;
                return;
            }

            // Case: no active subscription, but trial eligible
            if (trialEligible) {
                statusContainer.innerHTML = `
                    <span class="status-text">No active plan</span>
                    <button class="trial-btn" onclick="router.navigateTo('free-trial.html')">Start Free Trial</button>
                `;
                return;
            }

            // Case: no active subscription, trial not eligible (used or expired)
            statusContainer.innerHTML = `
                <span class="status-text">No active plan</span>
                <span class="status-text" style="color: var(--danger);">Please subscribe</span>
            `;
        }

        function renderPlanCards(plans) {
            const container = document.getElementById('plan-cards');
            if (!container) return;

            container.innerHTML = plans.map(plan => {
                let cardClass = 'plan-card';
                if (plan.popular) cardClass += ' popular';
                if (plan.id === 'trial') cardClass += ' trial-card';

                const durationDisplay = plan.durationText || utils.formatDuration(plan.duration);

                return `
                    <div class="${cardClass}" onclick="selectPlanCard('${plan.id}')">
                        <h3>${plan.name}</h3>
                        <div class="price">${plan.price === 0 ? 'FREE' : `KES ${plan.price}`}</div>
                        <div class="duration">${durationDisplay}</div>
                        <ul class="features">
                            ${plan.features.map(f => `<li>✓ ${f}</li>`).join('')}
                        </ul>
                        ${plan.limitations ? `<p class="limitations">${plan.limitations.join(', ')}</p>` : ''}
                        <button class="btn-${plan.ctaColor || 'primary'}">
                            ${plan.ctaText || 'Select'}
                        </button>
                    </div>
                `;
            }).join('');
        }

        window.selectPlanCard = function(planId) {
            const card = document.querySelector(`.plan-card[onclick*="'${planId}'"]`);
            if (card && card.classList.contains('disabled')) {
                ui.showToast('Free trial already used on this device', 'warning');
                return;
            }
            const plan = plansList.find(p => p.id === planId);
            if (!plan) {
                ui.showToast('Plan not found', 'error');
                return;
            }
            if (planId === 'trial') {
                router.navigateTo('free-trial.html');
            } else {
                app.setSelectedPlan(plan);
                router.navigateTo('payment.html');
            }
        };
    </script>
</head>
