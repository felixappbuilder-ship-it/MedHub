<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Subjects – MedHub</title>

    <link rel="manifest" href="/manifest.json">
    <link rel="stylesheet" href="/css/common.css" media="all">
    <link rel="stylesheet" href="/css/subjects.css" media="all">

    <!-- Inline theme fallback + additional styles for toggle and search -->
    <style id="theme-style">
        /* ---- Base dark fallback (before JS theme) ---- */
        body {
            background: var(--bg-primary, #1a1a2e);
            color: var(--text-primary, #eee);
            margin: 0;
            padding: 0;
            font-family: system-ui, -apple-system, sans-serif;
        }

        /* ---- Shimmer overlay (full page) ---- */
        #shimmer-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #1a1a2e; /* dark fallback */
            z-index: 9999;
            display: flex;
            flex-direction: column;
            padding: 0.5rem;
            overflow-y: auto;
            color: #aaa;
            transition: opacity 0.4s ease;
        }
        #shimmer-overlay.hidden {
            opacity: 0;
            pointer-events: none;
        }

        /* Shimmer header */
        .shimmer-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0.5rem 0;
            border-bottom: 1px solid #333;
            margin-bottom: 0.5rem;
        }
        .shimmer-logo {
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }
        .shimmer-logo-icon {
            width: 40px;
            height: 40px;
            border-radius: 6px;
            background: #2a2a3e;
            background: linear-gradient(90deg, #2a2a3e 25%, #444 50%, #2a2a3e 75%);
            background-size: 200px 100%;
            animation: shimmer 1.5s infinite;
        }
        .shimmer-logo-text {
            width: 100px;
            height: 20px;
            background: #2a2a3e;
            background: linear-gradient(90deg, #2a2a3e 25%, #444 50%, #2a2a3e 75%);
            background-size: 200px 100%;
            animation: shimmer 1.5s infinite;
            border-radius: 4px;
        }
        .shimmer-header-actions {
            display: flex;
            gap: 0.5rem;
        }
        .shimmer-btn-icon {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: #2a2a3e;
            background: linear-gradient(90deg, #2a2a3e 25%, #444 50%, #2a2a3e 75%);
            background-size: 200px 100%;
            animation: shimmer 1.5s infinite;
        }

        /* Second bar */
        .shimmer-second-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0.5rem 0;
            margin-bottom: 0.5rem;
        }
        .shimmer-greeting {
            width: 150px;
            height: 24px;
            background: #2a2a3e;
            background: linear-gradient(90deg, #2a2a3e 25%, #444 50%, #2a2a3e 75%);
            background-size: 200px 100%;
            animation: shimmer 1.5s infinite;
            border-radius: 4px;
        }
        .shimmer-sub-status {
            width: 120px;
            height: 20px;
            background: #2a2a3e;
            background: linear-gradient(90deg, #2a2a3e 25%, #444 50%, #2a2a3e 75%);
            background-size: 200px 100%;
            animation: shimmer 1.5s infinite;
            border-radius: 4px;
        }

        /* Quick actions */
        .shimmer-quick-actions {
            display: flex;
            gap: 0.5rem;
            margin-bottom: 1rem;
            flex-wrap: wrap;
        }
        .shimmer-btn {
            height: 40px;
            width: 120px;
            background: #2a2a3e;
            background: linear-gradient(90deg, #2a2a3e 25%, #444 50%, #2a2a3e 75%);
            background-size: 200px 100%;
            animation: shimmer 1.5s infinite;
            border-radius: 30px;
        }
        .shimmer-btn.small {
            width: 90px;
        }

        /* Subjects header */
        .shimmer-subjects-header {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            gap: 0.5rem;
            margin-bottom: 0.5rem;
        }
        .shimmer-title {
            width: 120px;
            height: 28px;
            background: #2a2a3e;
            background: linear-gradient(90deg, #2a2a3e 25%, #444 50%, #2a2a3e 75%);
            background-size: 200px 100%;
            animation: shimmer 1.5s infinite;
            border-radius: 4px;
        }
        .shimmer-toggle {
            display: flex;
            gap: 0.25rem;
            background: #2a2a3e;
            border-radius: 30px;
            padding: 0.25rem;
        }
        .shimmer-toggle-item {
            width: 60px;
            height: 30px;
            background: #3a3a4e;
            background: linear-gradient(90deg, #3a3a4e 25%, #555 50%, #3a3a4e 75%);
            background-size: 200px 100%;
            animation: shimmer 1.5s infinite;
            border-radius: 30px;
        }
        .shimmer-search {
            width: 150px;
            height: 36px;
            background: #2a2a3e;
            background: linear-gradient(90deg, #2a2a3e 25%, #444 50%, #2a2a3e 75%);
            background-size: 200px 100%;
            animation: shimmer 1.5s infinite;
            border-radius: 30px;
        }

        /* Shimmer grid */
        .shimmer-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 1rem;
            padding: 0.5rem 0;
            flex: 1;
        }
        @media screen and (min-width: 480px) {
            .shimmer-grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }
        @media screen and (min-width: 768px) {
            .shimmer-grid {
                grid-template-columns: repeat(3, 1fr);
            }
        }
        @media screen and (min-width: 1024px) {
            .shimmer-grid {
                grid-template-columns: repeat(4, 1fr);
            }
        }

        .shimmer-card {
            background: #2a2a3e;
            border: 1px solid #444;
            border-radius: 12px;
            padding: 1.5rem;
            display: flex;
            flex-direction: column;
        }
        .shimmer-icon {
            width: 64px;
            height: 64px;
            border-radius: 50%;
            background: #3a3a4e;
            background: linear-gradient(90deg, #3a3a4e 25%, #555 50%, #3a3a4e 75%);
            background-size: 200px 100%;
            animation: shimmer 1.5s infinite;
            margin-bottom: 0.75rem;
        }
        .shimmer-line {
            height: 16px;
            width: 80%;
            margin-bottom: 0.25rem;
            background: #3a3a4e;
            background: linear-gradient(90deg, #3a3a4e 25%, #555 50%, #3a3a4e 75%);
            background-size: 200px 100%;
            animation: shimmer 1.5s infinite;
            border-radius: 4px;
        }
        .shimmer-line.short {
            width: 60%;
        }
        .shimmer-line.progress {
            height: 8px;
            width: 100%;
            border-radius: 9999px;
            margin-bottom: 0.75rem;
        }
        .shimmer-actions {
            display: flex;
            gap: 0.5rem;
            margin-top: 0.75rem;
        }
        .shimmer-btn-sm {
            height: 32px;
            flex: 1;
            border-radius: 8px;
            background: #3a3a4e;
            background: linear-gradient(90deg, #3a3a4e 25%, #555 50%, #3a3a4e 75%);
            background-size: 200px 100%;
            animation: shimmer 1.5s infinite;
        }
        .shimmer-btn-study {
            height: 48px;
            width: 100%;
            border-radius: 8px;
            margin-top: 0.5rem;
            background: #3a3a4e;
            background: linear-gradient(90deg, #3a3a4e 25%, #555 50%, #3a3a4e 75%);
            background-size: 200px 100%;
            animation: shimmer 1.5s infinite;
        }

        /* Footer */
        .shimmer-footer {
            display: flex;
            justify-content: space-around;
            padding: 0.5rem 0;
            border-top: 1px solid #333;
            margin-top: 0.5rem;
        }
        .shimmer-footer-item {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            background: #2a2a3e;
            background: linear-gradient(90deg, #2a2a3e 25%, #444 50%, #2a2a3e 75%);
            background-size: 200px 100%;
            animation: shimmer 1.5s infinite;
        }

        @keyframes shimmer {
            0% { background-position: -200px 0; }
            100% { background-position: calc(200px + 100%) 0; }
        }

        /* Real content initially hidden */
        #real-content {
            display: none;
        }
        #real-content.visible {
            display: block;
        }

        /* ---- Existing subject card styles (kept for real content) ---- */
        .subject-card {
            background: var(--bg-secondary);
            border-radius: 12px;
            padding: 1.25rem;
            border: 1px solid var(--border);
            transition: transform 0.2s;
        }
        .subject-card:hover {
            transform: translateY(-2px);
        }
        .subject-icon {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            margin-bottom: 0.5rem;
        }
        .subject-card h3 {
            margin: 0.25rem 0;
            font-size: 1.1rem;
        }
        .subject-card p {
            color: var(--text-muted);
            font-size: 0.85rem;
            margin: 0 0 0.5rem 0;
        }
        .progress-bar {
            height: 6px;
            background: var(--bg-primary);
            border-radius: 9999px;
            overflow: hidden;
            margin: 0.5rem 0;
        }
        .progress-fill {
            height: 100%;
            border-radius: 9999px;
            transition: width 0.3s;
        }
        .card-actions {
            display: flex;
            gap: 0.4rem;
            flex-wrap: wrap;
            margin: 0.5rem 0;
        }
        .action-btn-sm {
            background: var(--bg-primary);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 0.3rem 0.6rem;
            font-size: 0.75rem;
            cursor: pointer;
            color: var(--text-primary);
            transition: 0.2s;
        }
        .action-btn-sm:hover {
            background: var(--accent);
            color: #fff;
        }
        .btn-study {
            background: var(--accent);
            border: none;
            border-radius: 8px;
            padding: 0.6rem;
            color: #fff;
            font-weight: 600;
            width: 100%;
            cursor: pointer;
            transition: 0.2s;
        }
        .btn-study:hover {
            opacity: 0.9;
            transform: scale(0.98);
        }

        /* ---- Notification badge (theme‑aware) ---- */
        .notification-btn {
            position: relative;
        }
        .notification-badge {
            position: absolute;
            top: -4px;
            right: -4px;
            background: var(--danger, #ef4444);
            color: white;
            border-radius: 9999px;
            font-size: 0.6rem;
            font-weight: 600;
            min-width: 18px;
            height: 18px;
            padding: 0 5px;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 2px solid var(--bg-card, #ffffff);
            line-height: 1;
        }
        .dark-theme .notification-badge {
            border-color: var(--bg-card, #1e1e2f);
        }
        body:not(.dark-theme) .notification-badge {
            border-color: var(--bg-card, #ffffff);
        }

        /* ---- Toggle and search styles (theme‑aware) ---- */
        .subjects-header {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            gap: 0.75rem;
            padding: 0.5rem 0.5rem 0 0.5rem;
        }
        .subjects-toggle {
            display: flex;
            gap: 0.25rem;
            background: var(--bg-secondary);
            border-radius: 30px;
            padding: 0.25rem;
            border: 1px solid var(--border);
        }
        .subjects-toggle button {
            border: none;
            background: transparent;
            padding: 0.4rem 1.2rem;
            border-radius: 30px;
            font-size: 0.9rem;
            font-weight: 500;
            cursor: pointer;
            color: var(--text-secondary);
            transition: all 0.2s;
            min-height: 36px;
        }
        .subjects-toggle button.active {
            background: var(--accent);
            color: white;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        .subjects-toggle button:hover:not(.active) {
            background: var(--bg-hover, var(--border));
        }

        .search-bar {
            display: none;
            position: relative;
            max-width: 300px;
            flex: 1;
        }
        .search-bar.visible {
            display: block;
        }
        .search-bar input {
            width: 100%;
            padding: 0.4rem 1rem 0.4rem 2.2rem;
            border-radius: 30px;
            border: 1px solid var(--border);
            background: var(--bg-card);
            color: var(--text-primary);
            font-size: 0.9rem;
            min-height: 36px;
        }
        .search-bar input:focus {
            outline: none;
            border-color: var(--accent);
        }
        .search-bar .search-icon {
            position: absolute;
            left: 0.75rem;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
            pointer-events: none;
            font-size: 1rem;
        }
        .search-bar .clear-icon {
            position: absolute;
            right: 0.75rem;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
            cursor: pointer;
            font-size: 0.9rem;
            display: none;
        }
        .search-bar .clear-icon.visible {
            display: block;
        }

        .subjects-count {
            font-size: 0.85rem;
            color: var(--text-muted);
            margin: 0.5rem 0.5rem 0 0.5rem;
        }

        /* Ensure grid adjusts when toggle is present */
        .subject-grid {
            transition: opacity 0.2s;
        }
        .subject-grid.loading {
            opacity: 0.5;
        }

        /* Remove extra margins on title when toggle is present */
        main h1 {
            margin: 0.5rem 0 0 0.5rem;
            font-size: 1.4rem;
            color: var(--text-primary);
        }

        /* ---- Referral button with animated border (kept as before) ---- */
        @property --border-angle {
            syntax: '<angle>';
            initial-value: 0deg;
            inherits: false;
        }

        @keyframes spin-border {
            to {
                --border-angle: 360deg;
            }
        }

        .footer-btn-referral {
            position: relative;
            background: transparent;
            border: none;
            padding: 0.4rem 1.2rem;
            border-radius: 40px;
            font-weight: 600;
            font-size: 0.9rem;
            color: var(--text-primary);
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
            z-index: 1;
            font-family: inherit;
            background: var(--bg-card);
            box-shadow: 0 0 15px rgba(255, 215, 0, 0.2);
            min-height: 48px;
        }

        .footer-btn-referral::before {
            content: '';
            position: absolute;
            inset: -2px;
            border-radius: 42px;
            padding: 2px;
            background: conic-gradient(from var(--border-angle, 0deg),
                    #ff6b6b,
                    #feca57,
                    #48dbfb,
                    #ff9ff3,
                    #54a0ff,
                    #5f27cd,
                    #ff6b6b);
            background-size: 100% 100%;
            -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            -webkit-mask-composite: xor;
            mask-composite: exclude;
            z-index: -1;
            animation: spin-border 3s linear infinite;
        }

        .footer-btn-referral::after {
            content: '';
            position: absolute;
            inset: -4px;
            border-radius: 44px;
            background: conic-gradient(from var(--border-angle, 0deg),
                    transparent 0%,
                    rgba(255, 215, 0, 0.15) 20%,
                    transparent 40%,
                    rgba(255, 215, 0, 0.15) 60%,
                    transparent 80%,
                    transparent 100%);
            background-size: 100% 100%;
            z-index: -2;
            animation: spin-border 3s linear infinite;
            filter: blur(4px);
        }

        .footer-btn-referral:hover {
            transform: scale(1.05);
            box-shadow: 0 0 25px rgba(255, 215, 0, 0.4);
        }

        .footer-btn-referral .referral-icon {
            font-size: 1.2rem;
        }
        .footer-btn-referral .referral-text {
            font-weight: 600;
            background: linear-gradient(135deg, #ff6b6b, #feca57, #48dbfb, #ff9ff3);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        /* Adjust footer layout */
        .app-footer {
            display: flex;
            justify-content: space-around;
            align-items: center;
            gap: 0.5rem;
            flex-wrap: wrap;
            padding: 0.5rem 0.75rem;
        }
        .app-footer .footer-btn {
            flex: 0 1 auto;
            min-width: 44px;
        }
        .footer-btn-referral {
            flex: 0 1 auto;
        }

        @media (max-width: 640px) {
            .app-footer {
                justify-content: space-between;
                gap: 0.25rem;
            }
            .footer-btn-referral {
                padding: 0.3rem 0.8rem;
                font-size: 0.75rem;
                min-height: 40px;
            }
            .footer-btn-referral .referral-text {
                font-size: 0.7rem;
            }
        }
    </style>

    <script type="module">
        import * as app from '../scripts/app.js';
        import * as ui from '../scripts/ui.js';
        import * as router from '../scripts/router.js';
        import * as auth from '../scripts/auth.js';
        import * as subscription from '../scripts/subscription.js';
        import * as analytics from '../scripts/analytics.js';
        import * as sync from '../scripts/sync.js';
        import * as db from '../scripts/db.js';
        import * as utils from '../scripts/utils.js';
        import * as notifications from '../scripts/notifications.js';
        import * as publicAssets from '../scripts/public-assets.js';

        // ==================== CORE SUBJECTS ====================
        const CORE_SUBJECTS = [
            { id: 'anatomy', name: 'Anatomy', icon: '💀', color: '#FF6B6B', questions: 1100 },
            { id: 'physiology', name: 'Physiology', icon: '🧠', color: '#4ECDC4', questions: 1150 },
            { id: 'biochemistry', name: 'Biochemistry', icon: '🧪', color: '#45B7D1', questions: 810 },
            { id: 'histology', name: 'Histology', icon: '🔬', color: '#96CEB4', questions: 900 },
            { id: 'embryology', name: 'Embryology', icon: '🐣', color: '#FFEAA7', questions: 950 },
            { id: 'pathology', name: 'Pathology', icon: '🩸', color: '#DDA0DD', questions: 1050 },
            { id: 'pharmacology', name: 'Pharmacology', icon: '💊', color: '#FDCB6E', questions: 800 },
            { id: 'microbiology', name: 'Microbiology', icon: '🦠', color: '#E17055', questions: 970 }
        ];

        // ==================== STATE ====================
        let extraSubjects = [];
        let activeView = 'core';
        let searchQuery = '';
        let progressMap = {};

        // ==================== UPDATE NOTIFICATION BADGE ====================
        function updateNotificationBadge() {
            const badge = document.getElementById('notificationBadge');
            if (!badge) return;
            const count = notifications.getUnreadCount ? notifications.getUnreadCount() : 0;
            if (count > 0) {
                badge.textContent = count > 99 ? '99+' : count;
                badge.style.display = 'flex';
            } else {
                badge.style.display = 'none';
            }
        }

        // ==================== RENDER SUBJECTS ====================
        function renderSubjects() {
            console.log('[Subjects] renderSubjects called, activeView:', activeView);
            const grid = document.getElementById('subject-grid');
            if (!grid) {
                console.error('[Subjects] subject-grid not found!');
                return;
            }

            let subjectsToRender = [];
            if (activeView === 'core') {
                subjectsToRender = CORE_SUBJECTS;
            } else {
                const q = searchQuery.toLowerCase().trim();
                subjectsToRender = q ? extraSubjects.filter(s => s.name.toLowerCase().includes(q)) : extraSubjects;
            }

            console.log('[Subjects] subjectsToRender count:', subjectsToRender.length);

            if (subjectsToRender.length === 0) {
                grid.innerHTML = `<p class="no-data" style="grid-column:1/-1;">${
                    activeView === 'core' ? 'No core subjects available.' :
                    searchQuery ? 'No subjects match your search.' : 'No additional subjects available.'
                }</p>`;
                console.log('[Subjects] Rendered empty state (no subjects)');
                return;
            }

            const isCore = activeView === 'core';
            console.log('[Subjects] isCore:', isCore);

            grid.innerHTML = subjectsToRender.map(sub => {
                const progress = isCore ? (progressMap[sub.id] || 0) : 0;
                const hasProgress = isCore && typeof progress === 'number';

                // For extra subjects, use folder if available, else id
                const navSubject = isCore ? sub.id : (sub.folder || sub.name);

                return `
                <div class="subject-card" style="border-top: 4px solid ${sub.color || '#666'}">
                    <div class="subject-icon" style="background: ${sub.color || '#666'}20">${sub.icon || '📚'}</div>
                    <h3>${sub.name}</h3>
                    <p>${sub.questions ? `${sub.questions} questions` : ''}</p>
                    ${hasProgress ? `
                        <div class="progress-bar">
                            <div class="progress-fill" style="width: ${progress}%; background: ${sub.color || '#666'}"></div>
                        </div>
                    ` : ''}
                    ${isCore ? `
                        <div class="card-actions">
                            <button class="action-btn-sm" onclick="window.navigateToVisualAid('${sub.id}')">🖼️ Visual Aid</button>
                            <button class="action-btn-sm" onclick="window.navigateToResources('${navSubject}', 'notes')">📝 Notes</button>
                            <button class="action-btn-sm" onclick="window.navigateToResources('${navSubject}', 'pastpaper')">📄 Past Papers</button>
                            <button class="action-btn-sm" onclick="window.navigateToResources('${navSubject}', 'textbook')">📘 Textbooks</button>
                        </div>
                        <button onclick="window.studySubject('${sub.id}')" class="btn-study">📖 Study (Exam)</button>
                    ` : `
                        <div class="card-actions">
                            <button class="action-btn-sm" onclick="window.navigateToResources('${navSubject}', 'notes')">📝 Notes</button>
                            <button class="action-btn-sm" onclick="window.navigateToResources('${navSubject}', 'pastpaper')">📄 Past Papers</button>
                            <button class="action-btn-sm" onclick="window.navigateToResources('${navSubject}', 'textbook')">📘 Textbooks</button>
                        </div>
                    `}
                </div>
            `;
            }).join('');

            console.log('[Subjects] Rendered cards successfully.');
        }

        // ==================== TOGGLE VIEW ====================
        function setView(view) {
            if (view === activeView) return;
            activeView = view;
            document.querySelectorAll('.subjects-toggle button').forEach(btn => {
                btn.classList.toggle('active', btn.dataset.view === view);
            });
            const searchBar = document.getElementById('searchBar');
            if (searchBar) {
                searchBar.classList.toggle('visible', view === 'other');
            }
            const countEl = document.getElementById('subjects-count');
            if (countEl) {
                countEl.style.display = view === 'other' ? 'block' : 'none';
            }
            if (view === 'core') {
                const searchInput = document.getElementById('searchInput');
                if (searchInput) {
                    searchInput.value = '';
                    searchQuery = '';
                    document.getElementById('clearSearch')?.classList.remove('visible');
                }
            }
            renderSubjects();
        }

        // ==================== LOAD EXTRA SUBJECTS ====================
        async function loadExtraSubjects() {
            try {
                const jsonData = await publicAssets.getResourcesUpdateJson();
                console.log('[Subjects] Raw JSON data:', jsonData);
                if (jsonData && Array.isArray(jsonData.subjects) && jsonData.subjects.length > 0) {
                    extraSubjects = jsonData.subjects.map(s => ({
                        id: s.id || s.name.toLowerCase().replace(/\s+/g, '-'),
                        name: s.name,
                        folder: s.folder || s.name,
                        icon: s.icon || '📚',
                        color: s.color || '#888',
                        questions: s.questions || 0,
                    }));
                    console.log('[Subjects] Loaded extra subjects:', extraSubjects);
                } else {
                    extraSubjects = [];
                }
            } catch (err) {
                console.warn('[Subjects] Failed to load extra subjects:', err);
                extraSubjects = [];
            }
        }

        // ==================== INIT ====================
        (async function initSubjects() {
            console.log('[Subjects] Initializing...');

            // Show shimmer overlay (it's visible by default)
            // Hide real content initially
            const realContent = document.getElementById('real-content');
            const shimmer = document.getElementById('shimmer-overlay');
            realContent.classList.remove('visible');

            await app.initializeApp();
            ui.applyTheme();

            if (!app.checkAuth()) {
                // Not authenticated – redirect to welcome, but hide shimmer first
                shimmer.classList.add('hidden');
                router.navigateTo('welcome.html');
                return;
            }

            const user = app.getUser();
            const sub = app.getSubscription();

            // Greeting
            const greetingEl = document.getElementById('user-greeting');
            if (greetingEl) greetingEl.textContent = user?.name ? `Hello, ${user.name.split(' ')[0]}` : 'Hello, Doctor';

            // Subscription status
            const statusContainer = document.getElementById('sub-status');
            if (statusContainer) {
                if (sub && sub.isActive) {
                    const remaining = (typeof subscription.formatRemainingTime === 'function')
                        ? await subscription.formatRemainingTime(sub.expiryDate)
                        : '—';
                    const expiryStr = utils.formatDate(sub.expiryDate);
                    statusContainer.innerHTML = `<span>Expires ${expiryStr} (${remaining})</span>`;
                } else {
                    statusContainer.innerHTML = `<button class="status-subscribe-btn" onclick="router.navigateTo('subscription.html')">Subscribe</button>`;
                }
            }

            // Sync indicator
            sync.monitorConnection();
            const syncIndicator = document.getElementById('sync-indicator');
            if (syncIndicator) syncIndicator.textContent = navigator.onLine ? 'Online' : 'Offline';

            // Subject progress from analytics
            const progress = await analytics.getSubjectProgress() || {};
            progressMap = progress;

            // Load extra subjects from public asset
            await publicAssets.initPublicAssets();
            await loadExtraSubjects();

            // Toggle visibility: only show toggle if extra subjects exist
            const toggleContainer = document.getElementById('subjectsToggle');
            const searchBar = document.getElementById('searchBar');
            const countEl = document.getElementById('subjects-count');

            if (extraSubjects.length > 0) {
                toggleContainer.style.display = 'flex';
                renderSubjects();
                countEl.style.display = 'none';
            } else {
                toggleContainer.style.display = 'none';
                searchBar.classList.remove('visible');
                countEl.style.display = 'none';
                activeView = 'core';
                renderSubjects();
            }

            // Quick actions
            const lastExam = await db.getLastExam();
            const continueBtn = document.getElementById('continue-last');
            if (continueBtn && lastExam) {
                continueBtn.style.display = 'inline-block';
                continueBtn.onclick = () => router.navigateTo(`exam-settings.html?resume=${lastExam.examId}`);
            }

            const weakAreas = await analytics.identifyWeakAreas();
            const weakBtn = document.getElementById('weak-areas');
            if (weakBtn && weakAreas && weakAreas.length > 0) {
                weakBtn.style.display = 'inline-block';
                const countSpan = document.getElementById('weak-areas-count');
                if (countSpan) countSpan.textContent = `Weak: ${weakAreas.slice(0,2).map(w => w.topic).join(', ')}`;
            }

            // Listen to online/offline
            window.addEventListener('online', () => {
                if (syncIndicator) syncIndicator.textContent = 'Online';
                ui.showToast('Back online', 'success');
            });
            window.addEventListener('offline', () => {
                if (syncIndicator) syncIndicator.textContent = 'Offline';
                ui.showToast('You are offline', 'warning');
            });

            // Notification badge
            updateNotificationBadge();
            app.events.on('new-notification', updateNotificationBadge);

            // Search input events
            const searchInput = document.getElementById('searchInput');
            const clearSearch = document.getElementById('clearSearch');
            if (searchInput) {
                searchInput.addEventListener('input', (e) => {
                    searchQuery = e.target.value;
                    clearSearch.classList.toggle('visible', searchQuery.length > 0);
                    renderSubjects();
                });
            }
            if (clearSearch) {
                clearSearch.addEventListener('click', () => {
                    searchInput.value = '';
                    searchQuery = '';
                    clearSearch.classList.remove('visible');
                    renderSubjects();
                });
            }

            console.log('[Subjects] Initialization complete.');

            // Hide shimmer, show real content
            shimmer.classList.add('hidden');
            realContent.classList.add('visible');

        })();

        // ==================== GLOBAL FUNCTIONS ====================
        window.studySubject = (subjectId) => router.navigateTo(`subject-specific.html?subject=${subjectId}`);
        window.navigateToVisualAid = (subjectId) => router.navigateTo(`resource-browser.html?subject=${subjectId}&type=visual`);
        window.navigateToResources = (subjectId, type) => router.navigateTo(`resource-browser.html?subject=${subjectId}&type=${type}`);
        window.logout = () => { auth.logout(); router.navigateTo('welcome.html'); };
        window.goToNotifications = () => router.navigateTo('notifications.html');
        window.setView = setView;
    </script>
