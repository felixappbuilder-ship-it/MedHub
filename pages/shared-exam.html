<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>Shared Exam – MedHub</title>
    
    <link rel="manifest" href="/manifest.json">
    <link rel="stylesheet" href="/css/common.css" media="all">
    <link rel="stylesheet" href="/css/results.css" media="all">
    
    <style>
        /* ===== ANDROID-FIRST LAYOUT ===== */
        * {
            box-sizing: border-box;
        }
        body {
            background: var(--bg-primary);
            margin: 0;
            padding: 0;
            font-family: system-ui, -apple-system, sans-serif;
            overflow: hidden;
            height: 100vh;
            height: 100dvh;
        }
        .page-container {
            display: flex;
            flex-direction: column;
            height: 100vh;
            height: 100dvh;
            overflow: hidden;
            max-width: 100%;
            margin: 0 auto;
        }

        /* ===== FIXED HEADER (Row 1) ===== */
        .fixed-header {
            flex-shrink: 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0.5rem 1rem;
            background: var(--bg-card);
            border-bottom: 1px solid var(--border);
            height: 56px;
            min-height: 56px;
            z-index: 10;
        }
        .fixed-header .logo {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            font-weight: 600;
            font-size: 1.1rem;
        }
        .fixed-header .logo img {
            width: 32px;
            height: 32px;
            border-radius: 6px;
        }
        .fixed-header .header-right {
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }
        .fixed-header .btn-outline {
            background: var(--bg-secondary);
            border: 1px solid var(--border);
            padding: 0.3rem 0.6rem;
            border-radius: 30px;
            font-size: 1.2rem;
            cursor: pointer;
            line-height: 1;
            transition: background 0.2s, color 0.2s;
        }
        .fixed-header .btn-outline:hover {
            background: var(--accent);
            color: white;
            border-color: var(--accent);
        }

        /* ===== FIXED NOTICE BAR (Row 2) ===== */
        .fixed-notice {
            flex-shrink: 0;
            background: var(--bg-secondary);
            padding: 0.5rem 1rem;
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 0.5rem;
            min-height: 52px;
            z-index: 9;
        }
        .fixed-notice .left {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            flex-wrap: wrap;
        }
        .share-badge {
            background: var(--warning);
            color: white;
            padding: 0.15rem 0.6rem;
            border-radius: 9999px;
            font-size: 0.65rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .read-only-note {
            font-size: 0.8rem;
            color: var(--text-secondary);
            margin: 0;
        }
        .fixed-notice .actions {
            display: flex;
            gap: 0.5rem;
            flex-wrap: wrap;
        }
        .fixed-notice .btn-sm {
            padding: 0.3rem 0.8rem;
            border-radius: 30px;
            font-size: 0.75rem;
            font-weight: 500;
            border: none;
            cursor: pointer;
            transition: background 0.2s;
            white-space: nowrap;
            min-height: 34px;
            display: inline-flex;
            align-items: center;
            gap: 0.3rem;
        }
        .btn-sm-primary {
            background: var(--accent);
            color: white;
        }
        .btn-sm-primary:hover {
            background: var(--accent-dark);
        }
        .btn-sm-success {
            background: var(--success);
            color: white;
        }
        .btn-sm-success:hover {
            background: #0e9f6e;
        }
        .btn-sm-secondary {
            background: var(--bg-secondary);
            color: var(--text-primary);
            border: 1px solid var(--border);
        }
        .btn-sm-secondary:hover {
            background: var(--border);
        }

        /* ===== SCROLLABLE CONTENT ===== */
        .scroll-content {
            flex: 1;
            overflow-y: auto;
            padding: 0.75rem 1rem 1rem;
            -webkit-overflow-scrolling: touch;
        }

        /* ===== SUMMARY CARD (COMPACT 3-ROW LAYOUT) ===== */
        .summary-compact {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 0.75rem 1rem;
            margin-bottom: 1rem;
            display: grid;
            grid-template-columns: auto 1fr;
            gap: 0.3rem 0.8rem;
            align-items: center;
            box-shadow: var(--shadow-sm);
        }
        .summary-compact .pie-cell {
            grid-row: 1 / 4;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 72px;
            height: 72px;
        }
        .summary-compact .pie-cell .score-circle {
            width: 72px;
            height: 72px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
            font-weight: 700;
            color: var(--text-primary);
            background: conic-gradient(var(--success) 0deg, var(--danger) 0deg);
            box-shadow: var(--shadow-sm);
            flex-shrink: 0;
        }
        .summary-compact .meta-item {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            padding: 0.1rem 0;
            font-size: 0.82rem;
            border-bottom: 1px dashed var(--border-light, rgba(0,0,0,0.04));
        }
        .summary-compact .meta-item:last-child {
            border-bottom: none;
        }
        .summary-compact .meta-label {
            color: var(--text-muted);
            font-weight: 400;
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 0.3px;
        }
        .summary-compact .meta-value {
            font-weight: 500;
            color: var(--text-primary);
            text-align: right;
        }
        .summary-compact .meta-value.subject {
            font-weight: 600;
            font-size: 0.95rem;
        }
        .summary-compact .meta-value.score {
            color: var(--accent);
            font-weight: 700;
        }
        .summary-compact .meta-value.mode {
            text-transform: capitalize;
        }

        /* ===== TOPIC PERFORMANCE ===== */
        .topic-section {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 0.75rem 1rem;
            margin-bottom: 1rem;
        }
        .topic-section h3 {
            font-size: 0.95rem;
            margin: 0 0 0.5rem 0;
        }
        .topic-list {
            list-style: none;
            padding: 0;
            margin: 0;
        }
        .topic-list li {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.3rem 0;
            border-bottom: 1px solid var(--border-light, rgba(0,0,0,0.04));
            font-size: 0.8rem;
        }
        .topic-list li:last-child {
            border-bottom: none;
        }
        .topic-name {
            flex: 1;
            font-weight: 500;
        }
        .topic-score {
            font-weight: 600;
            min-width: 44px;
            text-align: right;
        }
        .topic-count {
            color: var(--text-muted);
            font-size: 0.7rem;
            min-width: 44px;
            text-align: right;
        }
        .topic-bar {
            flex: 1;
            min-width: 60px;
            height: 5px;
            background: var(--border);
            border-radius: 9999px;
            overflow: hidden;
        }
        .bar-fill {
            height: 100%;
            transition: width 0.3s ease;
        }

        /* ===== QUESTION REVIEW ===== */
        .review-section h2 {
            font-size: 1rem;
            margin: 0 0 0.5rem 0;
        }
        .review-list {
            display: flex;
            flex-direction: column;
            gap: 0.6rem;
        }
        .review-item {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 0.6rem 0.8rem;
        }
        .review-item.correct {
            border-left: 3px solid var(--success);
        }
        .review-item.incorrect {
            border-left: 3px solid var(--danger);
        }
        .review-header {
            display: flex;
            gap: 0.5rem;
            align-items: center;
            flex-wrap: wrap;
            margin-bottom: 0.3rem;
        }
        .review-header .q-num {
            font-weight: 600;
            background: var(--bg-secondary);
            padding: 0.1rem 0.4rem;
            border-radius: var(--radius-sm);
            font-size: 0.7rem;
        }
        .review-header .status {
            font-size: 0.9rem;
        }
        .review-header .topic-tag {
            background: var(--bg-secondary);
            padding: 0.1rem 0.5rem;
            border-radius: 9999px;
            font-size: 0.65rem;
            color: var(--text-secondary);
            border: 1px solid var(--border);
        }
        .review-header .time-spent {
            color: var(--text-muted);
            font-size: 0.65rem;
            margin-left: auto;
        }
        .review-question {
            font-weight: 500;
            font-size: 0.9rem;
            margin-bottom: 0.3rem;
        }
        .review-answers {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 0.3rem;
            background: var(--bg-secondary);
            padding: 0.3rem 0.6rem;
            border-radius: var(--radius-sm);
            font-size: 0.78rem;
            margin-bottom: 0.3rem;
        }
        .review-answers div {
            word-break: break-word;
        }
        .review-explanation {
            background: var(--bg-secondary);
            padding: 0.3rem 0.6rem;
            border-radius: var(--radius-sm);
            font-size: 0.78rem;
            color: var(--text-secondary);
            border-left: 2px solid var(--accent);
        }
        .review-explanation .explanation-parts {
            display: flex;
            flex-direction: column;
            gap: 0.15rem;
        }
        .review-explanation .explanation-parts strong {
            color: var(--text-primary);
        }
        .flagged-badge {
            display: inline-block;
            background: var(--warning);
            color: white;
            padding: 0.1rem 0.4rem;
            border-radius: 9999px;
            font-size: 0.6rem;
            margin-top: 0.2rem;
        }
        .no-data {
            color: var(--text-muted);
            font-style: italic;
            padding: 0.5rem 0;
            text-align: center;
            font-size: 0.85rem;
        }

        /* ===== FIXED FOOTER ===== */
        .fixed-footer {
            flex-shrink: 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0.5rem 1rem;
            background: var(--bg-card);
            border-top: 1px solid var(--border);
            height: 56px;
            min-height: 56px;
            gap: 0.5rem;
            z-index: 10;
        }
        .fixed-footer .btn-text {
            background: none;
            border: none;
            color: var(--text-secondary);
            font-size: 0.85rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 0.3rem;
            padding: 0.4rem 0.6rem;
            border-radius: 30px;
            transition: background 0.2s;
        }
        .fixed-footer .btn-text:hover {
            background: var(--bg-secondary);
            color: var(--text-primary);
        }
        .fixed-footer .btn-share {
            background: var(--accent);
            color: white;
            border: none;
            padding: 0.4rem 0.8rem;
            border-radius: 30px;
            font-size: 0.8rem;
            font-weight: 500;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 0.3rem;
            transition: background 0.2s;
        }
        .fixed-footer .btn-share:hover {
            background: var(--accent-dark);
        }

        /* ===== ERROR / LOADING STATES ===== */
        .error-state {
            text-align: center;
            padding: 2rem 1rem;
        }
        .error-state h2 {
            font-size: 1.2rem;
            margin-bottom: 0.5rem;
            color: var(--danger);
        }
        .error-state p {
            color: var(--text-secondary);
            margin-bottom: 1rem;
            font-size: 0.9rem;
        }

        /* ===== MODAL ===== */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(4px);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 2000;
            padding: 1rem;
        }
        .modal-overlay.active {
            display: flex;
        }
        .modal-card {
            background: var(--bg-card);
            border-radius: var(--radius-lg);
            max-width: 380px;
            width: 100%;
            padding: 1.5rem;
            box-shadow: var(--shadow-lg);
            text-align: center;
            animation: fadeSlideUp 0.3s ease;
            position: relative;
        }
        @keyframes fadeSlideUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .modal-card h3 {
            margin-top: 0;
            font-size: 1.2rem;
        }
        .modal-card p {
            color: var(--text-secondary);
            margin-bottom: 1.2rem;
            font-size: 0.9rem;
        }
        .modal-actions {
            display: flex;
            flex-direction: column;
            gap: 0.6rem;
            align-items: center;
        }
        .modal-actions .btn {
            width: 100%;
            padding: 0.5rem;
            border-radius: 30px;
            font-weight: 500;
            font-size: 0.9rem;
        }
        .modal-close {
            position: absolute;
            top: 0.3rem;
            right: 0.6rem;
            background: none;
            border: none;
            font-size: 1.6rem;
            cursor: pointer;
            color: var(--text-muted);
            line-height: 1;
            padding: 0.1rem 0.4rem;
            border-radius: 50%;
            transition: background 0.2s;
        }
        .modal-close:hover {
            background: var(--bg-secondary);
            color: var(--text-primary);
        }
        .modal-divider {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            width: 100%;
            margin: 0.2rem 0;
        }
        .modal-divider::before,
        .modal-divider::after {
            content: "";
            flex: 1;
            height: 1px;
            background: var(--border);
        }
        .modal-divider span {
            color: var(--text-muted);
            font-size: 0.75rem;
        }

        /* ===== RESPONSIVE ===== */
        @media (max-width: 480px) {
            .fixed-notice .left {
                flex-direction: column;
                align-items: flex-start;
                gap: 0.1rem;
            }
            .fixed-notice .actions {
                width: 100%;
                justify-content: flex-end;
            }
            .summary-compact {
                padding: 0.5rem 0.75rem;
                gap: 0.2rem 0.5rem;
            }
            .summary-compact .pie-cell {
                width: 60px;
                height: 60px;
            }
            .summary-compact .pie-cell .score-circle {
                width: 60px;
                height: 60px;
                font-size: 1rem;
            }
            .review-answers {
                grid-template-columns: 1fr;
            }
            .fixed-footer .btn-text {
                font-size: 0.75rem;
            }
            .fixed-footer .btn-share {
                font-size: 0.7rem;
                padding: 0.3rem 0.6rem;
            }
        }
    </style>
    
    <!-- Core modules -->
    <script type="module" src="/scripts/utils.js"></script>
    <script type="module" src="/scripts/ui.js"></script>
    <script type="module" src="/scripts/router.js"></script>
    <script type="module" src="/scripts/app.js"></script>
    <script type="module" src="/scripts/db.js"></script>
    <script type="module" src="/scripts/convex-client.js"></script>
    
    <script>
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('/service-worker.js').catch(() => {});
        }
    </script>
</head>
<body>
    <div class="page-container">

        <!-- ===== FIXED HEADER (Row 1) ===== -->
        <header class="fixed-header">
            <div class="logo">
                <img src="/assets/images/logo.png" alt="Logo" width="32" height="32">
                <span>MedHub</span>
            </div>
            <div class="header-right">
                <button onclick="ui.toggleTheme()" class="btn-outline">🌓</button>
            </div>
        </header>

        <!-- ===== FIXED NOTICE BAR (Row 2) ===== -->
        <div class="fixed-notice" id="noticeBar">
            <div class="left">
                <span class="share-badge">SHARED</span>
                <p class="read-only-note">You are viewing a read‑only shared exam.</p>
            </div>
            <div class="actions" id="cta-actions">
                <!-- Dynamically populated -->
            </div>
        </div>

        <!-- ===== SCROLLABLE CONTENT ===== -->
        <div class="scroll-content" id="scrollContent">
            <div id="shared-results-container">
                <div class="loading" style="text-align:center; padding:2rem; color:var(--text-muted);">Loading exam...</div>
            </div>
        </div>

        <!-- ===== FIXED FOOTER ===== -->
        <footer class="fixed-footer">
            <button onclick="router.navigateTo('index.html')" class="btn-text">← Home</button>
            <button onclick="handleShare()" class="btn-share">📤 Share</button>
        </footer>

        <!-- ===== AUTH MODAL ===== -->
        <div class="modal-overlay" id="authModal">
            <div class="modal-card">
                <button class="modal-close" id="modalCloseBtn">&times;</button>
                <h3>🔒 Sign in to download</h3>
                <p>You need an account to save this exam to your personal collection.</p>
                <div class="modal-actions">
                    <button onclick="router.navigateTo('login.html')" class="btn btn-primary">Log In</button>
                    <div class="modal-divider"><span>or</span></div>
                    <button onclick="router.navigateTo('signup.html')" class="btn btn-secondary">Create Account</button>
                </div>
            </div>
        </div>

    </div>

    <script type="module">
        import * as ui from '../scripts/ui.js';
        import * as utils from '../scripts/utils.js';
        import * as router from '../scripts/router.js';
        import * as app from '../scripts/app.js';
        import * as db from '../scripts/db.js';
        import { convexHttpClient } from '../scripts/convex-client.js';

        let sharedExamData = null;
        let isLoggedIn = false;

        // ==================== DOM refs ====================
        const authModal = document.getElementById('authModal');
        const modalCloseBtn = document.getElementById('modalCloseBtn');
        const ctaActions = document.getElementById('cta-actions');
        const resultsContainer = document.getElementById('shared-results-container');

        // ==================== Modal helpers ====================
        function showAuthModal() { authModal.classList.add('active'); }
        function closeAuthModal() { authModal.classList.remove('active'); }
        authModal.addEventListener('click', (e) => { if (e.target === authModal) closeAuthModal(); });
        document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeAuthModal(); });
        modalCloseBtn.addEventListener('click', closeAuthModal);

        // ==================== Update CTA buttons ====================
        function updateCTAButtons() {
            if (isLoggedIn) {
                ctaActions.innerHTML = `
                    <button onclick="router.navigateTo('subjects.html')" class="btn-sm btn-sm-primary">📚 Subjects</button>
                    <button onclick="handleDownload()" class="btn-sm btn-sm-success">📥 Download</button>
                `;
            } else {
                ctaActions.innerHTML = `
                    <button onclick="router.navigateTo('signup.html')" class="btn-sm btn-sm-primary">Sign Up</button>
                    <button onclick="router.navigateTo('login.html')" class="btn-sm btn-sm-secondary">Log In</button>
                    <button onclick="handleDownload()" class="btn-sm btn-sm-success">📥 Download</button>
                `;
            }
        }

        // ==================== Download handler ====================
        window.handleDownload = function() {
            if (isLoggedIn) {
                downloadSharedExam();
            } else {
                showAuthModal();
            }
        };

        async function downloadSharedExam() {
            if (!sharedExamData) {
                ui.showToast('No exam data to download.', 'error');
                return;
            }

            const downloadBtn = ctaActions.querySelector('.btn-sm-success');
            if (downloadBtn) downloadBtn.disabled = true;
            ui.showLoading('Saving exam...');

            try {
                const examToSave = {
                    examId: sharedExamData.examId || 'shared_' + Date.now(),
                    subject: sharedExamData.subject || 'General',
                    date: sharedExamData.date || new Date().toISOString(),
                    score: sharedExamData.scorePercentage || 0,
                    correctAnswers: sharedExamData.correctAnswers || 0,
                    totalQuestions: sharedExamData.totalQuestions || 0,
                    scorePercentage: sharedExamData.scorePercentage || 0,
                    mode: sharedExamData.mode || 'Standard',
                    timeSpent: sharedExamData.timeSpent || 0,
                    timeAllocated: sharedExamData.timeAllocated || 0,
                    questions: (sharedExamData.questions || []).map(q => ({
                        id: q.id,
                        question: q.question,
                        options: q.options || [],
                        correctAnswer: q.correctAnswer || q.correct || '—',
                        userAnswer: q.userAnswer || 'Not answered',
                        timeSpent: q.timeSpent || 0,
                        correct: q.correct || (q.userAnswer && q.userAnswer === q.correctAnswer),
                        flagged: q.flagged || false,
                        topic: q.topic || 'General',
                        explanation: q.explanation || ''
                    })),
                    topicPerformance: sharedExamData.topicPerformance || sharedExamData.topics || [],
                    weakAreas: sharedExamData.weakAreas || [],
                    downloaded: true
                };

                await db.saveExamResult(examToSave);

                let downloaded = await db.getDownloadedExams() || [];
                downloaded = downloaded.filter(e => e.examId !== examToSave.examId);
                downloaded.unshift({
                    examId: examToSave.examId,
                    subject: examToSave.subject,
                    date: examToSave.date,
                    score: examToSave.scorePercentage,
                    data: examToSave
                });
                if (downloaded.length > 10) downloaded = downloaded.slice(0, 10);
                await db.saveDownloadedExams(downloaded);

                ui.showToast('Exam downloaded successfully!', 'success');
            } catch (error) {
                console.error(error);
                ui.showToast('Failed to download: ' + error.message, 'error');
            } finally {
                ui.hideLoading();
                if (downloadBtn) downloadBtn.disabled = false;
            }
        }

        // ==================== Share handler ====================
        window.handleShare = function() {
            const url = window.location.href;
            if (navigator.share) {
                navigator.share({
                    title: 'MedHub Shared Exam',
                    text: 'Check out this exam I shared on MedHub!',
                    url: url
                }).catch(() => {});
            } else {
                // Fallback: copy to clipboard
                navigator.clipboard.writeText(url).then(() => {
                    ui.showToast('Link copied to clipboard!', 'success');
                }).catch(() => {
                    prompt('Copy this link:', url);
                });
            }
        };

        // ==================== Main init ====================
        (async function initSharedExam() {
            ui.applyTheme();

            await app.initializeApp();
            isLoggedIn = app.checkAuth();
            updateCTAButtons();

            const urlParams = new URLSearchParams(window.location.search);
            const token = urlParams.get('token');

            if (!token) {
                resultsContainer.innerHTML = `
                    <div class="error-state">
                        <h2>Invalid Link</h2>
                        <p>No exam token provided.</p>
                        <button onclick="router.navigateTo('index.html')" class="btn-primary">Go Home</button>
                    </div>
                `;
                return;
            }

            ui.showLoading('Loading shared exam...');

            try {
                const examData = await convexHttpClient.query("sharedExams/queries:getByToken", { token });

                if (!examData) {
                    ui.hideLoading();
                    resultsContainer.innerHTML = `
                        <div class="error-state">
                            <h2>Exam Not Found</h2>
                            <p>This shared exam may have expired or been deleted.</p>
                            <button onclick="router.navigateTo('index.html')" class="btn-primary">Go Home</button>
                        </div>
                    `;
                    return;
                }

                sharedExamData = examData;

                // --- Prepare data ---
                const totalQuestions = examData.totalQuestions || 0;
                const correctAnswers = examData.correctAnswers || 0;
                const scorePercentage = totalQuestions > 0 ? (correctAnswers / totalQuestions) * 100 : 0;

                let topics = [];
                if (examData.topicPerformance) {
                    topics = examData.topicPerformance.map(t => ({
                        topic: t.topic,
                        correct: t.correct,
                        total: t.questions || t.total || 0,
                        percentage: t.percentage || ((t.correct / (t.questions || 1)) * 100),
                        avgTime: t.averageTime || 0
                    }));
                } else if (examData.topics) {
                    topics = examData.topics.map(t => ({
                        topic: t.topic,
                        correct: t.correct,
                        total: t.questions || t.total || 0,
                        percentage: t.percentage || ((t.correct / (t.questions || 1)) * 100),
                        avgTime: t.averageTime || 0
                    }));
                }

                const timeSpentSecs = Math.floor((examData.timeSpent || 0) / 1000);

                const questions = (examData.questions || []).map(q => {
                    const optionMap = {};
                    if (q.options && Array.isArray(q.options)) {
                        q.options.forEach((opt, idx) => {
                            const letter = String.fromCharCode(65 + idx);
                            optionMap[letter] = opt.text || opt;
                        });
                    }

                    let userAnswerText = '—';
                    if (q.userAnswer) {
                        const letter = q.userAnswer.trim().toUpperCase();
                        if (optionMap[letter]) userAnswerText = optionMap[letter];
                        else userAnswerText = q.userAnswer;
                    }

                    let correctAnswerText = '—';
                    if (q.correctAnswer) {
                        const letter = q.correctAnswer.trim().toUpperCase();
                        if (optionMap[letter]) correctAnswerText = optionMap[letter];
                        else correctAnswerText = q.correctAnswer;
                    }

                    let explanationText = '';
                    if (q.explanation) {
                        if (typeof q.explanation === 'string') {
                            explanationText = q.explanation;
                        } else if (typeof q.explanation === 'object') {
                            const parts = [];
                            if (q.explanation.overview) parts.push(`<strong>Overview:</strong> ${q.explanation.overview}`);
                            if (q.explanation.highYield) parts.push(`<strong>High Yield:</strong> ${q.explanation.highYield}`);
                            if (q.explanation.clinicalCorrelation) parts.push(`<strong>Clinical:</strong> ${q.explanation.clinicalCorrelation}`);
                            explanationText = parts.join('<br>');
                        }
                    }

                    return {
                        ...q,
                        userAnswerText,
                        correctAnswerText,
                        explanationText,
                        options: q.options,
                        correct: q.correct || (q.userAnswer && q.userAnswer === q.correctAnswer),
                        flagged: q.flagged || false,
                        timeSpent: q.timeSpent || 0
                    };
                });

                const results = {
                    scorePercentage,
                    subject: examData.subject || 'General',
                    date: examData.date || new Date().toISOString(),
                    correctAnswers,
                    totalQuestions,
                    timeSpent: timeSpentSecs,
                    mode: examData.mode || 'Standard',
                    topics,
                    questions
                };

                displaySharedResults(results);
            } catch (error) {
                console.error(error);
                let errorMsg = error.message || 'An unexpected error occurred.';
                if (errorMsg.includes('expired')) {
                    errorMsg = 'This shared exam has expired (links are valid for 48 hours).';
                }
                resultsContainer.innerHTML = `
                    <div class="error-state">
                        <h2>Error Loading Exam</h2>
                        <p>${errorMsg}</p>
                        <button onclick="router.navigateTo('index.html')" class="btn-primary">Go Home</button>
                    </div>
                `;
            } finally {
                ui.hideLoading();
            }
        })();

        // ==================== DISPLAY RESULTS ====================
        function displaySharedResults(results) {
            // Colour the pie chart: correct portion green, incorrect portion red
            const scorePct = Math.min(100, Math.max(0, results.scorePercentage));
            const correctDeg = (scorePct / 100) * 360;
            const pieBackground = `conic-gradient(var(--success) 0deg, var(--success) ${correctDeg}deg, var(--danger) ${correctDeg}deg, var(--danger) 360deg)`;

            let html = `
                <!-- Compact Summary Card -->
                <div class="summary-compact">
                    <div class="pie-cell">
                        <div class="score-circle" style="background: ${pieBackground};">${Math.round(scorePct)}%</div>
                    </div>
                    <div class="meta-item">
                        <span class="meta-label">Subject</span>
                        <span class="meta-value subject">${results.subject || 'General'}</span>
                    </div>
                    <div class="meta-item">
                        <span class="meta-label">Score</span>
                        <span class="meta-value score">${results.correctAnswers}/${results.totalQuestions}</span>
                    </div>
                    <div class="meta-item">
                        <span class="meta-label">Mode</span>
                        <span class="meta-value mode">${results.mode || 'Standard'}</span>
                    </div>
                    <div class="meta-item">
                        <span class="meta-label">Date</span>
                        <span class="meta-value">${utils.formatDate(results.date)}</span>
                    </div>
                    <div class="meta-item">
                        <span class="meta-label">Time</span>
                        <span class="meta-value">${utils.formatTime(results.timeSpent)}</span>
                    </div>
                </div>
            `;

            // Topic performance
            if (results.topics && results.topics.length > 0) {
                html += `<div class="topic-section"><h3>📊 Topics</h3><ul class="topic-list">`;
                results.topics.sort((a, b) => a.percentage - b.percentage).forEach(t => {
                    const color = t.percentage >= 70 ? 'var(--success)' : (t.percentage >= 50 ? 'var(--warning)' : 'var(--danger)');
                    const total = t.total || t.questions || 1;
                    const correct = t.correct || 0;
                    html += `
                        <li>
                            <span class="topic-name">${t.topic}</span>
                            <span class="topic-score" style="color:${color};">${Math.round(t.percentage)}%</span>
                            <span class="topic-count">${correct}/${total}</span>
                            <div class="topic-bar">
                                <div class="bar-fill" style="width: ${t.percentage}%; background: ${color};"></div>
                            </div>
                        </li>
                    `;
                });
                html += `</ul></div>`;
            }

            // Question review
            html += `<div class="review-section"><h2>📝 Question Review</h2><div class="review-list">`;
            if (results.questions && results.questions.length > 0) {
                results.questions.forEach((q, idx) => {
                    const isCorrect = q.correct;
                    const statusClass = isCorrect ? 'correct' : 'incorrect';
                    const statusIcon = isCorrect ? '✅' : '❌';
                    html += `
                        <div class="review-item ${statusClass}">
                            <div class="review-header">
                                <span class="q-num">Q${idx+1}</span>
                                <span class="status">${statusIcon}</span>
                                <span class="topic-tag">${q.topic || 'General'}</span>
                                <span class="time-spent">⏱️ ${q.timeSpent || 0}s</span>
                            </div>
                            <div class="review-question">${q.question}</div>
                            <div class="review-answers">
                                <div><strong>Your answer:</strong> ${q.userAnswerText}</div>
                                <div><strong>Correct answer:</strong> ${q.correctAnswerText}</div>
                            </div>
                            ${q.explanationText ? `<div class="review-explanation"><div class="explanation-parts">${q.explanationText}</div></div>` : ''}
                            ${q.flagged ? '<span class="flagged-badge">🏴 Flagged</span>' : ''}
                        </div>
                    `;
                });
            } else {
                html += `<p class="no-data">No question details available.</p>`;
            }
            html += `</div></div>`;

            resultsContainer.innerHTML = html;
        }

        // Re-check auth on focus
        window.addEventListener('focus', async () => {
            await app.initializeApp();
            const newAuth = app.checkAuth();
            if (newAuth !== isLoggedIn) {
                isLoggedIn = newAuth;
                updateCTAButtons();
            }
        });
    </script>

    <script data-lazy data-src="/scripts/offline.js"></script>
</body>
</html>
