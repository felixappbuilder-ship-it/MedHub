<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Payment – MedHub</title>

    <link rel="manifest" href="/manifest.json">
    <link rel="stylesheet" href="/css/common.css" media="all">
    <link rel="stylesheet" href="/css/payment.css" media="all">

    <!-- Inline dark fallback + shimmer styles -->
    <style id="theme-style">
        body {
            background: #1a1a2e;
            color: #eee;
            margin: 0;
            padding: 0;
            font-family: system-ui, -apple-system, sans-serif;
        }
        @keyframes shimmer {
            0% { background-position: -200px 0; }
            100% { background-position: calc(200px + 100%) 0; }
        }
        .shimmer-container {
            padding: 1rem;
        }
        .shimmer-header {
            padding: 0.5rem 1rem;
            background: #1e1e2f;
            border-bottom: 1px solid #333;
        }
        .shimmer-header-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .shimmer-header-bottom {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 0.5rem;
        }
        .shimmer-logo {
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }
        .shimmer-logo-icon {
            width: 40px;
            height: 40px;
            border-radius: 6px;
            background: #3a3a4e;
            background: linear-gradient(90deg, #3a3a4e 25%, #555 50%, #3a3a4e 75%);
            background-size: 200px 100%;
            animation: shimmer 1.5s infinite;
        }
        .shimmer-logo-text {
            width: 80px;
            height: 20px;
            background: #3a3a4e;
            background: linear-gradient(90deg, #3a3a4e 25%, #555 50%, #3a3a4e 75%);
            background-size: 200px 100%;
            animation: shimmer 1.5s infinite;
            border-radius: 4px;
        }
        .shimmer-btn-sm {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: #3a3a4e;
            background: linear-gradient(90deg, #3a3a4e 25%, #555 50%, #3a3a4e 75%);
            background-size: 200px 100%;
            animation: shimmer 1.5s infinite;
            display: inline-block;
        }
        .shimmer-title {
            height: 28px;
            width: 180px;
            background: #3a3a4e;
            background: linear-gradient(90deg, #3a3a4e 25%, #555 50%, #3a3a4e 75%);
            background-size: 200px 100%;
            animation: shimmer 1.5s infinite;
            border-radius: 4px;
        }
        .shimmer-card {
            background: #2a2a3e;
            border: 1px solid #444;
            border-radius: var(--radius);
            padding: 1.5rem;
            margin-bottom: 1.5rem;
        }
        .shimmer-line {
            height: 16px;
            background: #3a3a4e;
            background: linear-gradient(90deg, #3a3a4e 25%, #555 50%, #3a3a4e 75%);
            background-size: 200px 100%;
            animation: shimmer 1.5s infinite;
            border-radius: 4px;
            margin-bottom: 0.75rem;
        }
        .shimmer-line-lg {
            height: 32px;
            width: 60%;
        }
        .shimmer-input {
            height: 44px;
            border-radius: var(--radius-sm);
            background: #3a3a4e;
            background: linear-gradient(90deg, #3a3a4e 25%, #555 50%, #3a3a4e 75%);
            background-size: 200px 100%;
            animation: shimmer 1.5s infinite;
        }
        .shimmer-btn-full {
            height: 48px;
            width: 100%;
            border-radius: var(--radius-sm);
            background: #3a3a4e;
            background: linear-gradient(90deg, #3a3a4e 25%, #555 50%, #3a3a4e 75%);
            background-size: 200px 100%;
            animation: shimmer 1.5s infinite;
            margin-top: 1rem;
        }
        #real-content { display: none; }
    </style>

    <script type="module" src="/scripts/utils.js"></script>
    <script type="module" src="/scripts/ui.js"></script>
    <script type="module" src="/scripts/router.js"></script>
    <script type="module" src="/scripts/app.js"></script>
    <script type="module" src="/scripts/payment.js"></script>
    <script type="module" src="/scripts/validation.js"></script>
    <script type="module" src="/scripts/subscription.js"></script>

    <script>
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('/service-worker.js').catch(() => { });
        }
    </script>

    <!-- Additional styles for header layout -->
    <style>
        .pay-header {
            background: var(--bg-card);
            border-bottom: 1px solid var(--border);
            padding: 0.5rem 1rem;
        }
        .pay-header-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .pay-header-top .left-group {
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }
        .pay-header-top .left-group img {
            width: 36px;
            height: 36px;
            border-radius: 6px;
        }
        .pay-header-top .left-group .brand {
            font-weight: 600;
            font-size: 1.2rem;
        }
        .pay-header-top .right-group {
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }
        .pay-header-bottom {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 0.3rem;
        }
        .pay-header-bottom h2 {
            font-size: 1.4rem;
            margin: 0;
        }
        .pay-header-bottom .plan-summary {
            font-size: 0.9rem;
            color: var(--text-secondary);
        }
        .pay-header-bottom .plan-summary strong {
            color: var(--text-primary);
        }
        .change-plan-btn {
            background: var(--bg-secondary);
            border: 1px solid var(--border);
            border-radius: 30px;
            padding: 0.25rem 0.8rem;
            font-size: 0.8rem;
            cursor: pointer;
            color: var(--text-primary);
        }
        .change-plan-btn:hover {
            background: var(--border);
        }
        #payment-status {
            margin-top: 1rem;
        }
        #status-message {
            padding: 0.75rem;
            border-radius: 6px;
            background: var(--bg-secondary);
            border: 1px solid var(--border);
        }
        .poll-attempt {
            font-size: 0.9rem;
            color: var(--text-secondary);
        }
    </style>

    <script type="module">
        // Import dependencies
        import * as app from '../scripts/app.js';
        import * as ui from '../scripts/ui.js';
        import * as router from '../scripts/router.js';
        import * as validation from '../scripts/validation.js';
        import * as utils from '../scripts/utils.js';
        import * as payment from '../scripts/payment.js';
        import * as subscription from '../scripts/subscription.js';
        import * as auth from '../scripts/auth.js';

        // Store the poll cancellation function
        let cancelPoll = null;

        (async function initPayment() {
            console.log('[Payment] Initializing...');
            await app.initializeApp();
            ui.applyTheme();

            // Check authentication
            if (!app.checkAuth()) {
                ui.showToast('Please log in first', 'warning');
                router.navigateTo('login.html');
                return;
            }

            // Get the full plan object from app state
            const plan = app.getSelectedPlan();
            if (!plan) {
                ui.showToast('No plan selected', 'error');
                router.navigateTo('subscription.html');
                return;
            }

            // Display plan info – use durationText or format duration
            document.getElementById('plan-name').textContent = plan.name;
            document.getElementById('plan-price').textContent = `KES ${plan.price}`;
            const durationDisplay = plan.durationText || utils.formatDuration(plan.duration);
            document.getElementById('plan-duration').textContent = durationDisplay;

            // Update header summary
            const summaryEl = document.getElementById('plan-summary');
            if (summaryEl) {
                summaryEl.innerHTML = `<strong>${plan.name}</strong> · ${durationDisplay} · <strong>KES ${plan.price}</strong>`;
            }

            // Prefill phone from user profile
            const user = app.getUser();
            if (user?.phone) {
                document.getElementById('phone').value = user.phone;
            }

            // Setup live validation for phone
            validation.setupLiveValidation('payment-form', {
                phone: { required: true, phone: 'KE' }
            });

            // Hide shimmer, show real content
            document.getElementById('shimmer-content').style.display = 'none';
            document.getElementById('real-content').style.display = 'block';
        })();

        // Expose initiatePayment globally for onclick
        window.initiatePayment = async function (event) {
            event.preventDefault();

            const phone = document.getElementById('phone').value.trim();
            const plan = app.getSelectedPlan();

            if (!plan) {
                ui.showToast('No plan selected', 'error');
                return;
            }

            if (!validation.validatePhone(phone)) {
                ui.showToast('Enter a valid Kenyan phone (07XX or 2547XX)', 'error');
                return;
            }

            const formattedPhone = validation.formatKenyanPhone(phone);
            ui.showLoading('Initiating payment...');

            // Reset any previous poll
            if (cancelPoll) {
                cancelPoll();
                cancelPoll = null;
            }

            try {
                const result = await payment.initiateMPesaPayment(formattedPhone, plan.id);
                const transactionId = result.transactionId;

                ui.hideLoading();
                ui.showToast('Check your phone for M‑Pesa prompt', 'info');

                // Show status container
                const statusEl = document.getElementById('payment-status');
                statusEl.style.display = 'block';
                document.getElementById('status-message').textContent = '⏳ Waiting for payment confirmation...';
                document.getElementById('poll-attempt').textContent = '';

                // Use the new pollPaymentStatus method: 15s interval, 10 attempts
                cancelPoll = payment.pollPaymentStatus(
                    transactionId,
                    {
                        onUpdate: ({ status, attempt }) => {
                            console.log(`[Poll ${attempt}/10] Status: ${status}`);
                            document.getElementById('poll-attempt').textContent = `Checking (${attempt}/10)...`;
                            if (status === 'pending') {
                                document.getElementById('status-message').textContent = '⏳ Waiting for M‑Pesa confirmation...';
                            } else {
                                document.getElementById('status-message').textContent = `Status: ${status}`;
                            }
                        },
                        onComplete: async ({ status, timedOut }) => {
                            cancelPoll = null;
                            if (timedOut) {
                                document.getElementById('status-message').textContent = '⏰ Payment not confirmed after 150 seconds. Please check your M‑Pesa app or try again.';
                                document.getElementById('retry-btn').style.display = 'block';
                                ui.showToast('Payment timeout. Check M‑Pesa or retry.', 'warning');
                            } else if (status === 'completed') {
                                document.getElementById('status-message').textContent = '✅ Payment successful! Updating subscription...';
                                ui.showToast('Payment successful! Updating subscription...', 'success');
                                const user = app.getUser();
                                if (user && plan) {
                                    const now = new Date();
                                    let expiryDate;
                                    switch (plan.id) {
                                        case 'monthly':
                                            expiryDate = new Date(now.setMonth(now.getMonth() + 1));
                                            break;
                                        case 'quarterly':
                                            expiryDate = new Date(now.setMonth(now.getMonth() + 3));
                                            break;
                                        case 'yearly':
                                            expiryDate = new Date(now.setFullYear(now.getFullYear() + 1));
                                            break;
                                        default:
                                            expiryDate = new Date(now.setHours(now.getHours() + 3));
                                    }
                                    const subscriptionData = {
                                        userId: user.id,
                                        plan: plan.id,
                                        isActive: true,
                                        expiryDate: expiryDate.toISOString(),
                                        autoRenew: false
                                    };
                                    await subscription.activatePlan(subscriptionData);
                                    app.setSubscription(subscriptionData);
                                }
                                setTimeout(() => router.navigateTo('subjects.html'), 1500);
                            } else {
                                document.getElementById('status-message').textContent = `❌ Payment ${status}. Please try again.`;
                                document.getElementById('retry-btn').style.display = 'block';
                                ui.showToast(`Payment ${status}. Please retry.`, 'error');
                            }
                            document.getElementById('poll-attempt').textContent = '';
                        }
                    },
                    15000, // 15 seconds
                    10     // 10 attempts = 150 seconds total
                );
            } catch (error) {
                ui.hideLoading();
                ui.showToast(error.message || 'Payment initiation failed', 'error');
            }
        };

        window.retryPayment = function () {
            document.getElementById('retry-btn').style.display = 'none';
            document.getElementById('status-message').textContent = '🔄 Retrying...';
            initiatePayment(new Event('submit'));
        };

        window.addEventListener('beforeunload', () => {
            if (cancelPoll) {
                cancelPoll();
                cancelPoll = null;
            }
        });
    </script>
</head>

<body>
    <div class="page-container">
        <!-- ===== SHIMMER CONTENT ===== -->
        <div id="shimmer-content">
            <div class="shimmer-header">
                <div class="shimmer-header-top">
                    <div class="shimmer-logo">
                        <div class="shimmer-logo-icon"></div>
                        <div class="shimmer-logo-text"></div>
                    </div>
                    <div>
                        <span class="shimmer-btn-sm" style="margin-right: 0.5rem;"></span>
                        <span class="shimmer-btn-sm"></span>
                        <span class="shimmer-btn-sm" style="margin-left: 0.5rem;"></span>
                    </div>
                </div>
                <div class="shimmer-header-bottom">
                    <div class="shimmer-title"></div>
                    <div style="display: flex; gap: 0.5rem;">
                        <div style="width: 80px; height: 28px; background: #3a3a4e; background: linear-gradient(90deg, #3a3a4e 25%, #555 50%, #3a3a4e 75%); background-size: 200px 100%; animation: shimmer 1.5s infinite; border-radius: 4px;"></div>
                        <div style="width: 60px; height: 28px; background: #3a3a4e; background: linear-gradient(90deg, #3a3a4e 25%, #555 50%, #3a3a4e 75%); background-size: 200px 100%; animation: shimmer 1.5s infinite; border-radius: 4px;"></div>
                    </div>
                </div>
            </div>
            <div class="shimmer-container">
                <div class="shimmer-card">
                    <div class="shimmer-line shimmer-line-lg"></div>
                    <div class="shimmer-line"></div>
                    <div class="shimmer-line"></div>
                    <div class="shimmer-line" style="width: 70%;"></div>
                </div>
                <div class="shimmer-card">
                    <div class="shimmer-line" style="width: 40%;"></div>
                    <div class="shimmer-input"></div>
                    <div class="shimmer-line" style="width: 60%; margin-top: 0.5rem;"></div>
                </div>
                <div class="shimmer-btn-full"></div>
                <div class="shimmer-btn-full" style="background: #2a2a3e; border: 1px solid #444; margin-top: 0.5rem;"></div>
            </div>
        </div>

        <!-- ===== REAL CONTENT ===== -->
        <div id="real-content">
            <!-- Two-row fixed header -->
            <div class="pay-header">
                <div class="pay-header-top">
                    <div class="left-group">
                        <img src="../assets/images/logo.png" alt="Logo" width="36" height="36">
                        <span class="brand">MedHub</span>
                        <button onclick="router.navigateTo('subjects.html')" class="btn-text" style="font-size: 0.9rem; padding: 0.2rem 0.5rem;">← Back</button>
                    </div>
                    <div class="right-group">
                        <button class="change-plan-btn" onclick="router.navigateTo('subscription.html')">Change Plan</button>
                        <button onclick="ui.toggleTheme()" class="btn-outline" style="padding: 0.3rem 0.6rem;">🌓</button>
                    </div>
                </div>
                <div class="pay-header-bottom">
                    <h2>Complete Payment</h2>
                    <div class="plan-summary" id="plan-summary"></div>
                </div>
            </div>

            <main class="payment-container">
                <div class="order-summary">
                    <h3>Order Summary</h3>
                    <p><span>Plan:</span> <span id="plan-name"></span></p>
                    <p><span>Amount:</span> <span id="plan-price" class="amount"></span></p>
                    <p><span>Duration:</span> <span id="plan-duration"></span></p>
                </div>

                <form id="payment-form" onsubmit="initiatePayment(event)">
                    <div class="form-group">
                        <label for="phone">M‑Pesa Phone Number</label>
                        <input type="tel" id="phone" name="phone" placeholder="e.g., 0712345678 or 254712345678"
                            autocomplete="tel" required>
                        <div class="error-message" data-for="phone"></div>
                        <small>Enter the number registered with M‑Pesa</small>
                    </div>

                    <div class="payment-instructions">
                        <p>📱 1. After clicking Pay, check your phone for an M‑Pesa prompt.</p>
                        <p>🔢 2. Enter your M‑Pesa PIN to confirm.</p>
                        <p>⏳ 3. Wait for confirmation – this may take up to 2 minutes.</p>
                    </div>

                    <button type="submit" class="btn-primary btn-large">💰 Pay Now</button>
                    <button id="retry-btn" type="button" onclick="retryPayment()" class="btn-secondary"
                        style="display:none;">↻ Retry Payment</button>
                </form>

                <div id="payment-status" style="display:none;">
                    <div id="status-message" style="padding: 0.75rem; border-radius: 6px; background: var(--bg-secondary); border: 1px solid var(--border);"></div>
                    <div id="poll-attempt" class="poll-attempt" style="margin-top: 0.5rem;"></div>
                </div>
            </main>
        </div>
    </div>

    <script data-lazy data-src="/scripts/offline.js"></script>
</body>

</html>
