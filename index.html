<!DOCTYPE html>
<html lang="en">
<head>
    <!-- ============================================================
         MedVix — hostname-based launch router.
         MUST be the first thing in <head>, above every meta tag and
         stylesheet. Runs synchronously before the browser parses the
         rest of the document, so the Play Store redirect fires before
         any resource is fetched and no flash of the SPA is visible.
         ============================================================ -->
 
<script>
(function medvixLaunchRouter() {
    'use strict';

    var PLAY_STORE =
        'https://play.google.com/store/apps/details?id=com.medhurb.app';

    var APP_HOSTS = [
        'app.medvix.co.ke',
        'www.app.medvix.co.ke'
    ];

    var WEB_HOSTS = [
        'medvix.co.ke',
        'www.medvix.co.ke'
    ];

    try {
        var host = location.hostname.toLowerCase();
        var path = location.pathname;

        // Main website: always load normally.
        if (WEB_HOSTS.includes(host)) return;

        // Unknown hostname: no routing.
        if (!APP_HOSTS.includes(host)) return;

        // Prevent redirect loops on the QR landing page.
        if (path === '/download-qr.html') return;

        // Protect native Capacitor application.
        if (
            window.Capacitor &&
            typeof window.Capacitor.isNativePlatform === 'function' &&
            window.Capacitor.isNativePlatform()
        ) return;

        // Preserve the original destination.
        var destination =
            path + location.search + location.hash;

        // Android browser: redirect to Play Store.
        if (/Android/i.test(navigator.userAgent || '')) {

            var referrer = new URLSearchParams({
                deep_link: destination || '/'
            }).toString();

            var playUrl = new URL(PLAY_STORE);

            playUrl.searchParams.set('referrer', referrer);

            location.replace(playUrl.toString());
            return;
        }

        // Non-Android: display QR download page.
        var qrUrl = new URL('/download-qr.html', location.origin);

        qrUrl.searchParams.set(
            'target',
            location.origin + destination
        );

        location.replace(qrUrl.toString());

    } catch (error) {
        console.error('[MedVix Router]', error);

        // Safe fallback.
        if (/Android/i.test(navigator.userAgent || '')) {
            location.replace(PLAY_STORE);
        }
    }
})();
</script>

<body>
  <div id="app-root"></div>

  <script>
    (async function () {
      try {
        const res = await fetch('/pages/home.html');
        if (!res.ok) throw new Error('HTTP ' + res.status);
        const html = await res.text();

        const doc = new DOMParser().parseFromString(html, 'text/html');
        const section = doc.querySelector('section[data-page]');
        if (!section) throw new Error('no <section data-page>');

        const styleHref = section.dataset.style;
        if (styleHref) {
          const link = document.createElement('link');
          link.rel = 'stylesheet';
          link.href = styleHref;
          link.dataset.page = section.dataset.page;
          document.head.appendChild(link);
        }

        document.getElementById('app-root').innerHTML = section.outerHTML;
        // Fallback now matches the <head> title so the tab/preview
        // never reverts to the old "MedHub" name.
        document.title = section.dataset.title || 'MedVix — Learn. Practice. Connect. Grow. Achieve.';
      } catch (err) {
        console.error('[index] failed to load home:', err);
      }
    })();
  </script>

  <!-- ============================================================
     EMOJI → FONT AWESOME REPLACEMENT
     - Loads the mapping from /emoji-map.json
     - Replaces emoji characters with <i class="fa-solid ...">
     - Converts text nodes that are just an FA class string
       (e.g. "fa-solid fa-bone") into real <i> elements
     - Watches #app-root so newly-injected pages get processed
     ============================================================ -->
  <script>
  (async function () {
    let PALETTE = {};
    let EMOJI_MAP = {};

    // ---- Load map ----
    try {
      const res = await fetch('/emoji-map.json', { cache: 'default' });
      if (!res.ok) throw new Error('HTTP ' + res.status);
      const data = await res.json();
      PALETTE   = (data && data.palette) || {};
      EMOJI_MAP = (data && data.emojis)  || {};
      const count = Object.keys(EMOJI_MAP).length;
      if (!count) {
        console.warn('[Emoji] emoji-map.json is empty.');
        return;
      }
      console.info('[Emoji] Loaded ' + count + ' entries.');
    } catch (err) {
      console.warn('[Emoji] Could not load /emoji-map.json:', err);
      return;
    }

    // ---- Helpers ----
    const escapeRegExp = s => s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');

    function resolveColor(name) {
      if (!name || typeof name !== 'string') return null;
      if (name.startsWith('#') || name.startsWith('rgb')) return name;
      return PALETTE[name] || null;
    }

    const keys = Object.keys(EMOJI_MAP).sort((a, b) => b.length - a.length);
    const emojiRegex     = new RegExp(keys.map(escapeRegExp).join('|'), 'gu');
    const emojiTestRegex = new RegExp(keys.map(escapeRegExp).join('|'), 'u');

    const FA_TEXT_REGEX = /^\s*(?:fa-solid|fa-regular|fa-brands|fas|far|fab)(?:\s+fa-[\w-]+)+\s*$/;

    function buildIconFromClass(className) {
      const i = document.createElement('i');
      let cls = className.trim()
        .replace(/^fas\b/, 'fa-solid')
        .replace(/^far\b/, 'fa-regular')
        .replace(/^fab\b/, 'fa-brands');
      if (!/^fa-(solid|regular|brands)\b/.test(cls)) cls = 'fa-solid ' + cls;
      i.className = cls;
      i.setAttribute('aria-hidden', 'true');
      return i;
    }

    function buildIconFromEntry(info) {
      const i = document.createElement('i');
      i.className = 'fa-solid ' + info.icon;
      i.setAttribute('aria-hidden', 'true');
      if (info.label) i.title = info.label;
      const color = resolveColor(info.color);
      if (color) i.style.color = color;
      return i;
    }

    // ---- Replace emojis in text nodes ----
    function replaceEmojis(root) {
      const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, {
        acceptNode(node) {
          return node.nodeValue && emojiTestRegex.test(node.nodeValue)
            ? NodeFilter.FILTER_ACCEPT
            : NodeFilter.FILTER_REJECT;
        }
      });

      const textNodes = [];
      while (walker.nextNode()) textNodes.push(walker.currentNode);

      textNodes.forEach(node => {
        const text = node.nodeValue;
        const fragment = document.createDocumentFragment();
        let lastIndex = 0;
        let match;

        emojiRegex.lastIndex = 0;
        while ((match = emojiRegex.exec(text)) !== null) {
          if (match.index > lastIndex) {
            fragment.appendChild(document.createTextNode(text.slice(lastIndex, match.index)));
          }
          const emoji = match[0];
          const info = EMOJI_MAP[emoji];
          fragment.appendChild(info ? buildIconFromEntry(info) : document.createTextNode(emoji));
          lastIndex = emojiRegex.lastIndex;
        }

        if (lastIndex < text.length) {
          fragment.appendChild(document.createTextNode(text.slice(lastIndex)));
        }

        node.parentNode.replaceChild(fragment, node);
      });
    }

    // ---- Replace bare FA class strings ----
    function replaceFAClassText(root) {
      const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, {
        acceptNode(node) {
          return node.nodeValue && FA_TEXT_REGEX.test(node.nodeValue)
            ? NodeFilter.FILTER_ACCEPT
            : NodeFilter.FILTER_REJECT;
        }
      });

      const textNodes = [];
      while (walker.nextNode()) textNodes.push(walker.currentNode);

      textNodes.forEach(node => {
        const icon = buildIconFromClass(node.nodeValue.trim());
        node.parentNode.replaceChild(icon, node);
      });
    }

    // ---- Aria-label icon-only buttons ----
    function enhanceIconButtons(root) {
      root.querySelectorAll('button, a').forEach(el => {
        const icons = el.querySelectorAll('i.fa-solid, i.fa-regular, i.fa-brands');
        const text  = el.textContent.trim();
        if (icons.length === 1 && text === '') {
          const label = icons[0].title || 'Button';
          if (!el.getAttribute('aria-label')) el.setAttribute('aria-label', label);
          if (!el.title) el.title = label;
        }
      });
    }

    // ---- Strip emojis from placeholders ----
    function cleanPlaceholders(root) {
      root.querySelectorAll('[placeholder]').forEach(el => {
        const ph = el.getAttribute('placeholder');
        if (!ph) return;
        emojiRegex.lastIndex = 0;
        const cleaned = ph.replace(emojiRegex, '').trim();
        if (cleaned !== ph) el.setAttribute('placeholder', cleaned);
      });
    }

    function process(root) {
      if (!root) return;
      if (root.nodeType !== 1 && root.nodeType !== 9) return;
      try {
        replaceEmojis(root);
        replaceFAClassText(root);
        enhanceIconButtons(root);
        cleanPlaceholders(root);
      } catch (err) {
        console.warn('[Emoji] process() failed:', err);
      }
    }

    // ---- Initial pass ----
    process(document.body);

    // ---- Watch the SPA mount point and any late DOM changes ----
    const observer = new MutationObserver(mutations => {
      mutations.forEach(m => {
        if (m.type === 'characterData' && m.target && m.target.parentNode) {
          process(m.target.parentNode);
          return;
        }
        m.addedNodes.forEach(node => {
          if (node.nodeType === 1) {
            process(node);
          } else if (node.nodeType === 3 && node.parentNode && node.parentNode.nodeType === 1) {
            process(node.parentNode);
          }
        });
      });
    });

    observer.observe(document.body, {
      childList: true,
      subtree: true,
      characterData: true
    });
  })();
  </script>

  <script type="module" src="/scripts/app.js"></script>
</body>
