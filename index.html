<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>MedHub – Kenya's #1 Offline Medical QB</title>

    <!-- PWA & Non‑blocking CSS -->
    <link rel="manifest" href="/manifest.json">
    <link rel="stylesheet" href="/css/common.css" media="all">
    <link rel="stylesheet" href="/css/index.css" media="all">

    <!-- Critical deferred scripts (load after render) -->
    <script type="module" src="/scripts/utils.js"></script>
    <script type="module" src="/scripts/ui.js"></script>
    <script type="module" src="/scripts/router.js"></script>
    <script type="module" src="/scripts/app.js"></script>
    <script type="module" src="/scripts/referral.js"></script>

    <!-- Service Worker registration – instant, non‑blocking -->
    <script>
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('/service-worker.js')
                .then(() => console.log('SW registered'))
                .catch(err => console.warn('SW failed:', err));
        }
    </script>

    <!-- Page‑specific init – runs after DOM, calls imported modules -->
    <script defer>
        (async function initIndex() {
            // Wait for deferred scripts to load
            await new Promise(resolve => window.addEventListener('load', resolve));

            // App state & authentication check – redirect if already logged in
            if (window.app?.checkAuth?.()) {
                router.navigateTo('subjects.html');
                return;
            }

            // Setup UI utilities, theme, and install prompt
            ui.applyTheme();
            ui.setupInstallPrompt('install-btn');

            // ---- REFERRAL DETECTION ----
            const refCode = window.referral?.detectReferralFromURL?.() || window.referral?.getStoredReferralCode?.();
            if (refCode) {
                console.log('[Index] Referral detected:', refCode);
                // Show referral banner
                const banner = document.createElement('div');
                banner.className = 'referral-banner';
                banner.innerHTML = `
                    <div class="referral-banner-content">
                        <p>🎉 You were referred by a MedHub user! Sign up to get started.</p>
                        <button onclick="router.navigateTo('signup.html')" class="btn-primary">Sign Up Now</button>
                        <button class="btn-text close-banner" onclick="this.parentElement.parentElement.remove()">✕</button>
                    </div>
                `;
                const heroSection = document.querySelector('.hero');
                if (heroSection) {
                    heroSection.parentNode.insertBefore(banner, heroSection.nextSibling);
                } else {
                    document.querySelector('main').prepend(banner);
                }
            }

            // ---- FEATURE CARDS ----
            const features = [
                { icon: '📱', title: '100% Offline', desc: '5,000+ questions stored on your phone. No internet needed.' },
                { icon: '⏱️', title: 'Adaptive Timing', desc: '21–54 sec per question, based on difficulty.' },
                { icon: '💳', title: 'M‑Pesa Only', desc: 'KES 350/mo, 850/3mo, 2,100/yr. Kenyan‑first.' },
                { icon: '🛡️', title: 'Anti‑Cheat', desc: 'Time manipulation = instant lock.' }
            ];
            ui.renderFeatureGrid('feature-grid', features);

            // ---- TESTIMONIALS ----
            ui.renderTestimonials('testimonials', [
                { name: 'Dr. A. M.', text: 'Passed my exams with ease. The offline mode saved me.' }
            ]);

            // ---- FAQ ----
            ui.renderFaq('faq-section', [
                { q: 'How do I pay?', a: 'M‑Pesa only. Select a plan, enter your Safaricom number.' },
                { q: 'Can I study without internet?', a: 'Yes. All questions are stored offline.' }
            ]);
        })();
    </script>
</head>

<body class="loading">
    <!-- Page‑specific content -->
    <div class="page-container">
        <header>
            <div class="logo">
                <img src="/assets/images/logo.png" alt="MedHub" width="48" height="48">
                <span>MedHub</span>
            </div>
            <div class="header-actions">
                <a href="/pages/referral.html" class="btn-text" style="display: none;" id="referral-link">💰 Refer & Earn</a>
                <button id="theme-toggle" onclick="ui.toggleTheme()" class="btn-outline">🌓</button>
            </div>
        </header>

        <main id="main-content">
            <!-- Hero -->
            <section class="hero">
                <h1>Serious medical exam prep.<br><span class="accent">Works anywhere, even without internet.</span>
                </h1>
                <div class="cta-buttons">
                    <button onclick="router.navigateTo('welcome.html')" class="btn-primary">Get Started</button>
                    <button id="install-btn" class="btn-secondary" style="display:none;">📲 Install App</button>
                </div>
            </section>

            <!-- Feature grid – populated by ui.js -->
            <section id="feature-grid" class="feature-grid"></section>

            <!-- Testimonials -->
            <section id="testimonials" class="testimonials"></section>

            <!-- FAQ -->
            <section id="faq-section" class="faq"></section>

            <!-- Footer -->
            <footer>
                <p>📞 0746834527 | ✉️ felixappbuilder@gmail.com</p>
                <p>
                    <a href="/pages/privacy.html">Privacy Policy</a> |
                    <a href="/pages/terms.html">Terms</a> |
                    <a href="/pages/referral.html">💰 Refer & Earn</a>
                </p>
            </footer>
        </main>
    </div>

    <!-- Lazy offline script -->
    <script data-lazy data-src="/scripts/offline.js"></script>
</body>

</html>
