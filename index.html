    <!-- ============================================================
         MEDVIX — EARLY HOSTNAME-BASED LAUNCH ROUTER

         Must remain the first executable script in <head>.
         Runs synchronously without waiting for DOMContentLoaded,
         window.onload, or any other page resources.

         ROUTING:
         app.medvix.co.ke / www.app.medvix.co.ke
           Android       -> Google Play Store
           Other devices -> /download-qr.html

         medvix.co.ke / www.medvix.co.ke
           -> Normal website

         Unknown hostnames
           -> No redirect
         ============================================================ -->

    <script>
    (function medvixLaunchRouter() {
        'use strict';

        var PLAY_STORE =
            'https://play.google.com/store/apps/details?id=com.medhurb.app';

        var APP_HOSTS = [
            'app.medvix.co.ke',
            'www.app.medvix.co.ke'
        ];

        var WEB_HOSTS = [
            'medvix.co.ke',
            'www.medvix.co.ke'
        ];

        // Recognized social preview crawlers.
        var SOCIAL_BOTS =
            /facebookexternalhit|Facebot|WhatsApp|Twitterbot|LinkedInBot|TelegramBot|Slackbot|Discordbot|Googlebot|bingbot|Pinterestbot|SkypeUriPreview|redditbot|Applebot/i;

        try {
            var host = location.hostname.toLowerCase();

            // ----------------------------------------------------
            // 1. Main website: never redirect.
            // ----------------------------------------------------
            if (WEB_HOSTS.indexOf(host) !== -1) {
                return;
            }

            // ----------------------------------------------------
            // 2. Unknown hostnames: leave untouched.
            // ----------------------------------------------------
            if (APP_HOSTS.indexOf(host) === -1) {
                return;
            }

            // ----------------------------------------------------
            // 3. Preserve social preview access.
            // ----------------------------------------------------
            var ua = navigator.userAgent || '';

            if (SOCIAL_BOTS.test(ua)) {
                return;
            }

            // ----------------------------------------------------
            // 4. Protect the native Capacitor application.
            // ----------------------------------------------------

            // Native Capacitor origin protection.
            var protocol = location.protocol.toLowerCase();

            if (
                protocol === 'capacitor:' ||
                protocol === 'ionic:'
            ) {
                return;
            }

            // Native marker protection, if injected by the app.
            if (window.__MEDVIX_NATIVE_APP__ === true) {
                return;
            }

            // Capacitor runtime protection.
            if (
                window.Capacitor &&
                typeof window.Capacitor.isNativePlatform === 'function' &&
                window.Capacitor.isNativePlatform()
            ) {
                return;
            }

            // ----------------------------------------------------
            // 5. Detect Android.
            // ----------------------------------------------------
            var isAndroid =
                /Android/i.test(ua) ||
                /Android/i.test(navigator.platform || '') ||
                (
                    navigator.userAgentData &&
                    navigator.userAgentData.platform === 'Android'
                );

            // ----------------------------------------------------
            // 6. Preserve the original destination.
            // Includes pathname, query parameters and hash.
            // ----------------------------------------------------
            var destination =
                location.pathname +
                location.search +
                location.hash;

            destination = destination || '/';

            // ----------------------------------------------------
            // 7. Android -> Google Play Store.
            // ----------------------------------------------------
            if (isAndroid) {

                // Preserve the existing nested encoding convention.
                var referrer = new URLSearchParams({
                    deep_link: destination
                }).toString();

                var playUrl = new URL(PLAY_STORE);

                playUrl.searchParams.set('referrer', referrer);

                // Immediate navigation.
                location.replace(playUrl.toString());

                return;
            }

            // ----------------------------------------------------
            // 8. Non-Android -> QR download page.
            // ----------------------------------------------------
            var qrUrl = new URL(
                '/pages/download-qr.html',
                location.origin
            );

            qrUrl.searchParams.set(
                'target',
                location.origin + destination
            );

            location.replace(qrUrl.toString());

        } catch (error) {
            console.error('[MedVix Launch Router]', error);

            // Emergency Android fallback.
            if (/Android/i.test(navigator.userAgent || '')) {
                location.replace(PLAY_STORE);
            }
        }
    })();
    </script>

    <!-- ============================================================
         HOME PAGE LOADER
         ============================================================ -->

    <script>
    (async function () {
        try {
            const res = await fetch('/pages/home.html');

            if (!res.ok) {
                throw new Error('HTTP ' + res.status);
            }

            const html = await res.text();

            const doc = new DOMParser().parseFromString(
                html,
                'text/html'
            );

            const section = doc.querySelector('section[data-page]');

            if (!section) {
                throw new Error('no <section data-page>');
            }

            // Load page-specific stylesheet.
            const styleHref = section.dataset.style;

            if (styleHref) {
                const link = document.createElement('link');

                link.rel = 'stylesheet';
                link.href = styleHref;
                link.dataset.page = section.dataset.page;

                document.head.appendChild(link);
            }

            // Inject home page.
            document.getElementById('app-root').innerHTML =
                section.outerHTML;

            // Update document title.
            document.title =
                section.dataset.title ||
                'MedVix — Learn. Practice. Connect. Grow. Achieve.';

        } catch (err) {
            console.error('[index] failed to load home:', err);
        }
    })();
    </script>


    <!-- ============================================================
         EMOJI → FONT AWESOME REPLACEMENT

         - Loads mappings from /emoji-map.json.
         - Replaces mapped emoji characters with Font Awesome icons.
         - Converts bare Font Awesome class strings into <i> elements.
         - Enhances icon-only buttons with accessible labels.
         - Cleans emojis from placeholders.
         - Observes #app-root for dynamically injected content.
         ============================================================ -->

    <script>
    (async function () {
        let PALETTE = {};
        let EMOJI_MAP = {};

        // --------------------------------------------------------
        // 1. Load emoji mapping.
        // --------------------------------------------------------

        try {
            const res = await fetch('/emoji-map.json', {
                cache: 'default'
            });

            if (!res.ok) {
                throw new Error('HTTP ' + res.status);
            }

            const data = await res.json();

            PALETTE = (data && data.palette) || {};
            EMOJI_MAP = (data && data.emojis) || {};

            const count = Object.keys(EMOJI_MAP).length;

            if (!count) {
                console.warn('[Emoji] emoji-map.json is empty.');
                return;
            }

            console.info('[Emoji] Loaded ' + count + ' entries.');

        } catch (err) {
            console.warn(
                '[Emoji] Could not load /emoji-map.json:',
                err
            );

            return;
        }


        // --------------------------------------------------------
        // 2. Helpers.
        // --------------------------------------------------------

        const escapeRegExp = s =>
            s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');


        function resolveColor(name) {
            if (!name || typeof name !== 'string') {
                return null;
            }

            if (
                name.startsWith('#') ||
                name.startsWith('rgb')
            ) {
                return name;
            }

            return PALETTE[name] || null;
        }


        const keys = Object.keys(EMOJI_MAP).sort(
            (a, b) => b.length - a.length
        );

        const emojiRegex = new RegExp(
            keys.map(escapeRegExp).join('|'),
            'gu'
        );

        const emojiTestRegex = new RegExp(
            keys.map(escapeRegExp).join('|'),
            'u'
        );


        const FA_TEXT_REGEX =
            /^\s*(?:fa-solid|fa-regular|fa-brands|fas|far|fab)(?:\s+fa-[\w-]+)+\s*$/;


        // --------------------------------------------------------
        // 3. Build Font Awesome icon from class string.
        // --------------------------------------------------------

        function buildIconFromClass(className) {
            const i = document.createElement('i');

            let cls = className.trim()
                .replace(/^fas\b/, 'fa-solid')
                .replace(/^far\b/, 'fa-regular')
                .replace(/^fab\b/, 'fa-brands');

            if (!/^fa-(solid|regular|brands)\b/.test(cls)) {
                cls = 'fa-solid ' + cls;
            }

            i.className = cls;

            i.setAttribute('aria-hidden', 'true');

            return i;
        }


        // --------------------------------------------------------
        // 4. Build icon from emoji map entry.
        // --------------------------------------------------------

        function buildIconFromEntry(info) {
            const i = document.createElement('i');

            i.className = 'fa-solid ' + info.icon;

            i.setAttribute('aria-hidden', 'true');

            if (info.label) {
                i.title = info.label;
            }

            const color = resolveColor(info.color);

            if (color) {
                i.style.color = color;
            }

            return i;
        }


        // --------------------------------------------------------
        // 5. Replace emojis in text nodes.
        // --------------------------------------------------------

        function replaceEmojis(root) {
            const walker = document.createTreeWalker(
                root,
                NodeFilter.SHOW_TEXT,
                {
                    acceptNode(node) {
                        return node.nodeValue &&
                            emojiTestRegex.test(node.nodeValue)
                            ? NodeFilter.FILTER_ACCEPT
                            : NodeFilter.FILTER_REJECT;
                    }
                }
            );

            const textNodes = [];

            while (walker.nextNode()) {
                textNodes.push(walker.currentNode);
            }

            textNodes.forEach(node => {
                const text = node.nodeValue;

                const fragment =
                    document.createDocumentFragment();

                let lastIndex = 0;
                let match;

                emojiRegex.lastIndex = 0;

                while (
                    (match = emojiRegex.exec(text)) !== null
                ) {
                    if (match.index > lastIndex) {
                        fragment.appendChild(
                            document.createTextNode(
                                text.slice(lastIndex, match.index)
                            )
                        );
                    }

                    const emoji = match[0];
                    const info = EMOJI_MAP[emoji];

                    fragment.appendChild(
                        info
                            ? buildIconFromEntry(info)
                            : document.createTextNode(emoji)
                    );

                    lastIndex = emojiRegex.lastIndex;
                }

                if (lastIndex < text.length) {
                    fragment.appendChild(
                        document.createTextNode(
                            text.slice(lastIndex)
                        )
                    );
                }

                if (node.parentNode) {
                    node.parentNode.replaceChild(
                        fragment,
                        node
                    );
                }
            });
        }


        // --------------------------------------------------------
        // 6. Replace bare Font Awesome class strings.
        // --------------------------------------------------------

        function replaceFAClassText(root) {
            const walker = document.createTreeWalker(
                root,
                NodeFilter.SHOW_TEXT,
                {
                    acceptNode(node) {
                        return node.nodeValue &&
                            FA_TEXT_REGEX.test(node.nodeValue)
                            ? NodeFilter.FILTER_ACCEPT
                            : NodeFilter.FILTER_REJECT;
                    }
                }
            );

            const textNodes = [];

            while (walker.nextNode()) {
                textNodes.push(walker.currentNode);
            }

            textNodes.forEach(node => {
                const icon = buildIconFromClass(
                    node.nodeValue.trim()
                );

                if (node.parentNode) {
                    node.parentNode.replaceChild(
                        icon,
                        node
                    );
                }
            });
        }


        // --------------------------------------------------------
        // 7. Improve accessibility of icon-only buttons.
        // --------------------------------------------------------

        function enhanceIconButtons(root) {
            root.querySelectorAll('button, a').forEach(el => {
                const icons = el.querySelectorAll(
                    'i.fa-solid, i.fa-regular, i.fa-brands'
                );

                const text = el.textContent.trim();

                if (icons.length === 1 && text === '') {
                    const label = icons[0].title || 'Button';

                    if (!el.getAttribute('aria-label')) {
                        el.setAttribute('aria-label', label);
                    }

                    if (!el.title) {
                        el.title = label;
                    }
                }
            });
        }


        // --------------------------------------------------------
        // 8. Strip emojis from placeholders.
        // --------------------------------------------------------

        function cleanPlaceholders(root) {
            root.querySelectorAll('[placeholder]').forEach(el => {
                const ph = el.getAttribute('placeholder');

                if (!ph) {
                    return;
                }

                emojiRegex.lastIndex = 0;

                const cleaned = ph
                    .replace(emojiRegex, '')
                    .trim();

                if (cleaned !== ph) {
                    el.setAttribute('placeholder', cleaned);
                }
            });
        }


        // --------------------------------------------------------
        // 9. Process DOM nodes.
        // --------------------------------------------------------

        function process(root) {
            if (!root) {
                return;
            }

            if (
                root.nodeType !== 1 &&
                root.nodeType !== 9
            ) {
                return;
            }

            try {
                replaceEmojis(root);
                replaceFAClassText(root);
                enhanceIconButtons(root);
                cleanPlaceholders(root);

            } catch (err) {
                console.warn(
                    '[Emoji] process() failed:',
                    err
                );
            }
        }


        // --------------------------------------------------------
        // 10. Initial processing.
        // --------------------------------------------------------

        process(document.body);


        // --------------------------------------------------------
        // 11. Observe dynamically injected DOM content.
        // --------------------------------------------------------

        const observer = new MutationObserver(mutations => {
            mutations.forEach(m => {

                if (
                    m.type === 'characterData' &&
                    m.target &&
                    m.target.parentNode
                ) {
                    process(m.target.parentNode);
                    return;
                }

                m.addedNodes.forEach(node => {

                    if (node.nodeType === 1) {
                        process(node);

                    } else if (
                        node.nodeType === 3 &&
                        node.parentNode &&
                        node.parentNode.nodeType === 1
                    ) {
                        process(node.parentNode);
                    }

                });
            });
        });


        observer.observe(document.body, {
            childList: true,
            subtree: true,
            characterData: true
        });

    })();
    </script>
